<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<meta name="description" content="{{DESCRICAO}}">
<meta name="theme-color" content="{{COR}}">
<link rel="icon" href="{{FAVICON}}">
<script>
  try { var t = localStorage.getItem('sns.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="motor/estilo.css">
<link rel="stylesheet" href="assets/tema.css">
</head>
<body>
<div class="progress-bar" id="readbar" aria-hidden="true"></div>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Abrir sumário" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/" aria-label="Início">
    <span class="brand-mark">{{MARCA}}</span>
    <span class="brand-text">{{NOME}} <small>{{LEGENDA}}</small></span>
  </a>
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="search" placeholder="Buscar no livro…  ( / )" aria-label="Buscar no livro">
  </form>
  <div class="tools">
    <button class="icon-btn" id="fontDown" aria-label="Diminuir texto" title="Diminuir texto"><span style="font-size:13px;font-weight:700">A−</span></button>
    <button class="icon-btn" id="fontUp" aria-label="Aumentar texto" title="Aumentar texto"><span style="font-size:17px;font-weight:700">A+</span></button>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema claro/escuro" title="Alternar tema">
      <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Sumário do livro"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="rail" id="rail" aria-label="Neste capítulo"></aside>
</div>

<script src="motor/colecao.js"></script>
<script src="assets/book-data.js"></script>
<script src="motor/app.js"></script>
</body>
</html>
