<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Uma cabeça cheia de vozes que se contradizem; uma decisão registrada" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Arial,sans-serif"><defs><linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#e2efee'/><stop offset='1' stop-color='#c3dddb'/></linearGradient><filter id='sombra' x='-10%' y='-10%' width='125%' height='135%'><feDropShadow dx='0' dy='3' stdDeviation='3' flood-color='#1f2430' flood-opacity='.22'/></filter></defs><rect width='800' height='420' rx='22' fill='url(#bg)'/><circle cx='740' cy='40' r='150' fill='#d9632b' opacity='.13'/><circle cx='40' cy='410' r='130' fill='#0f766e' opacity='.10'/><rect x='0' y='358' width='800' height='62' rx='22' fill='#0f766e' opacity='.16'/><rect x='0' y='358' width='800' height='62' fill='#0f766e' opacity='0'/><circle cx="300" cy="200" r="158" fill="#e5b893" stroke="#a9714a" stroke-width="5"/><rect x="262" y="338" width="76" height="40" rx="14" fill="#e5b893" stroke="#a9714a" stroke-width="5"/><rect x="162" y="90" width="132" height="40" rx="18" fill="#fff" stroke="#2f7fd6" stroke-width="3.5" transform="rotate(-6 228 110)"/><text x="228" y="116" font-size="15" font-weight="800" fill="#2f7fd6" text-anchor="middle">2 revisões!</text><rect x="306" y="104" width="132" height="40" rx="18" fill="#fff" stroke="#d8454f" stroke-width="3.5" transform="rotate(5 372 124)"/><text x="372" y="130" font-size="15" font-weight="800" fill="#d8454f" text-anchor="middle">entregar em 2 h!</text><rect x="148" y="172" width="132" height="40" rx="18" fill="#fff" stroke="#7a5bd6" stroke-width="3.5" transform="rotate(4 214 192)"/><text x="214" y="198" font-size="15" font-weight="800" fill="#7a5bd6" text-anchor="middle">foco de 2 h!</text><rect x="320" y="180" width="132" height="40" rx="18" fill="#fff" stroke="#ef7d2d" stroke-width="3.5" transform="rotate(-5 386 200)"/><text x="386" y="206" font-size="15" font-weight="800" fill="#ef7d2d" text-anchor="middle">chat em 15 min!</text><rect x="170" y="250" width="132" height="40" rx="18" fill="#fff" stroke="#2e9e6b" stroke-width="3.5" transform="rotate(-4 236 270)"/><text x="236" y="276" font-size="15" font-weight="800" fill="#2e9e6b" text-anchor="middle">padronize!</text><rect x="300" y="256" width="132" height="40" rx="18" fill="#fff" stroke="#d6409f" stroke-width="3.5" transform="rotate(6 366 276)"/><text x="366" y="282" font-size="15" font-weight="800" fill="#d6409f" text-anchor="middle">autonomia!</text><path d="M262,60 q8,-14 16,0 q8,14 16,0" fill="none" stroke="#8892a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M330,56 q8,-14 16,0 q8,14 16,0" fill="none" stroke="#8892a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="202.0" y="383.8" width="196.0" height="28.5" rx="14.2" fill="#8a5a2b"/><text x="300" y="402.95" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">mitote: vozes demais</text><rect x="540" y="112" width="236" height="128" rx="16" fill="#e3f6ec" stroke="#2e9e6b" stroke-width="3" filter="url(#sombra)"/><text x="658.0" y="152.3" font-size="16" font-weight="800" fill="#1b6a46" text-anchor="middle"><tspan x="658.0" dy="0">Decisão registrada:</tspan><tspan x="658.0" dy="19.5">em incidente, vale</tspan><tspan x="658.0" dy="19.5">a regra de 2 horas.</tspan><tspan x="658.0" dy="19.5">Motivo: cliente parado</tspan></text><g transform="translate(764 112) scale(0.6)"><circle cx="0" cy="0" r="22" fill="#2e9e6b" stroke="none" stroke-width="3"/><path d="M-10,1 L-3,9 L11,-8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g></svg>