<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Quatro cartões: palavra, lado pessoal, conclusões e melhor possível" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Arial,sans-serif"><defs><linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#e2efee'/><stop offset='1' stop-color='#c3dddb'/></linearGradient><filter id='sombra' x='-10%' y='-10%' width='125%' height='135%'><feDropShadow dx='0' dy='3' stdDeviation='3' flood-color='#1f2430' flood-opacity='.22'/></filter></defs><rect width='800' height='420' rx='22' fill='url(#bg)'/><circle cx='740' cy='40' r='150' fill='#d9632b' opacity='.13'/><circle cx='40' cy='410' r='130' fill='#0f766e' opacity='.10'/><rect x='0' y='358' width='800' height='62' rx='22' fill='#0f766e' opacity='.16'/><rect x='0' y='358' width='800' height='62' fill='#0f766e' opacity='0'/><rect x="30" y="28" width="360" height="166" rx="22" fill="#fff" stroke="#2f7fd6" stroke-width="4" filter="url(#sombra)"/><rect x="30" y="28" width="14" height="166" rx="7" fill="#2f7fd6"/><text x="266" y="72" font-size="20" font-weight="900" fill="#2f7fd6" text-anchor="middle">1  Palavra impecável</text><text x="282" y="128" font-size="16" font-weight="700" fill="#3d4457" text-anchor="middle"><tspan x="282" dy="0">diga o que faz,</tspan><tspan x="282" dy="19.5">cumpra ou avise antes</tspan></text><rect x="410" y="28" width="360" height="166" rx="22" fill="#fff" stroke="#7a5bd6" stroke-width="4" filter="url(#sombra)"/><rect x="410" y="28" width="14" height="166" rx="7" fill="#7a5bd6"/><text x="646" y="72" font-size="20" font-weight="900" fill="#7a5bd6" text-anchor="middle">2  Nada é pessoal</text><text x="662" y="128" font-size="16" font-weight="700" fill="#3d4457" text-anchor="middle"><tspan x="662" dy="0">o comentário é sobre</tspan><tspan x="662" dy="19.5">o código, não sobre você</tspan></text><rect x="30" y="214" width="360" height="166" rx="22" fill="#fff" stroke="#ef7d2d" s