<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0008"/>
      <stop offset="50%" stop-color="#9b1230"/>
      <stop offset="100%" stop-color="#3a0414"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f5b800"/>
    </linearGradient>
    <linearGradient id="angGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#dd1b44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo com gradiente suave -->
  <rect width="800" height="420" fill="url(#bg)"/>
  
  <!-- Grid tático de fundo -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- Conteúdo Central -->
  
        <!-- Bundle Monolítico Pesado -->
        <g transform="translate(220, 170)">
          <rect x="-110" y="-70" width="220" height="140" rx="14" fill="#301" stroke="#888" stroke-width="2"/>
          <text x="0" y="-30" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#faa" text-anchor="middle">Eager Loading</text>
          <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">12 MB</text>
          <text x="0" y="30" font-family="'Segoe UI',sans-serif" font-size="12" fill="#888" text-anchor="middle">Lento, pesado, imóvel</text>
        </g>
        <text x="390" y="175" font-family="'Segoe UI',sans-serif" font-size="32" fill="#f5b800" text-anchor="middle">→</text>
        <!-- Chunks Fracionados Leves -->
        <g transform="translate(580, 170)">
          <rect x="-120" y="-70" width="110" height="60" rx="8" fill="#143" stroke="#2e9e6b" stroke-width="2"/>
          <text x="-65" y="-35" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">main: 60kB</text>
          <rect x="10" y="-70" width="110" height="60" rx="8" fill="#203" stroke="#ff6b35" stroke-width="2"/>
          <text x="65" y="-35" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">home: 20kB</text>
          <rect x="-120" y="10" width="110" height="60" rx="8" fill="#203" stroke="#00bcd4" stroke-width="2"/>
          <text x="-65" y="45" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">auth: 15kB</text>
          <rect x="10" y="10" width="110" height="60" rx="8" fill="#203" stroke="#dd1b44" stroke-width="2"/>
          <text x="65" y="45" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">painel: 30kB</text>
        </g>
        

  <!-- Rodapé com títulos -->
  <rect x="0" y="360" width="800" height="60" fill="#0c0004" opacity="0.6"/>
  <text x="40" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="0.02em">CAP. 7 · O PREÇO DA INÉRCIA</text>
  <text x="760" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#ff6b35" text-anchor="end" letter-spacing="0.05em">LAZY LOADING E CODE SPLITTING</text>
</svg>