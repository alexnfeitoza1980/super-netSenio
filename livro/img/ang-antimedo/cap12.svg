<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0008"/>
      <stop offset="50%" stop-color="#9b1230"/>
      <stop offset="100%" stop-color="#3a0414"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f5b800"/>
    </linearGradient>
    <linearGradient id="angGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#dd1b44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo com gradiente suave -->
  <rect width="800" height="420" fill="url(#bg)"/>
  
  <!-- Grid tático de fundo -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- Conteúdo Central -->
  
        <g transform="translate(240, 160)">
          <circle cx="0" cy="0" r="50" fill="#311" stroke="#f44" stroke-width="3"/>
          <text x="0" y="-5" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">FALHA</text>
          <text x="0" y="16" font-family="'Segoe UI',sans-serif" font-size="11" fill="#faa" text-anchor="middle">HttpError 500</text>
        </g>
        <path d="M 300 160 L 480 160" stroke="#f5b800" stroke-width="4" stroke-dasharray="6 3"/>
        <g transform="translate(550, 160)">
          <rect x="-100" y="-50" width="200" height="100" rx="12" fill="#032" stroke="#2e9e6b" stroke-width="2"/>
          <text x="0" y="-12" font-family="'Cascadia Code',monospace" font-size="14" font-weight="800" fill="#2e9e6b" text-anchor="middle">retry(3)</text>
          <text x="0" y="15" font-family="'Cascadia Code',monospace" font-size="13" fill="#fff" text-anchor="middle">catchError()</text>
          <text x="0" y="35" font-family="'Segoe UI',sans-serif" font-size="11" fill="#aaa" text-anchor="middle">Recuperação sem crash</text>
        </g>
        

  <!-- Rodapé com títulos -->
  <rect x="0" y="360" width="800" height="60" fill="#0c0004" opacity="0.6"/>
  <text x="40" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="0.02em">CAP. 12 · AME PROBLEMAS</text>
  <text x="760" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#ff6b35" text-anchor="end" letter-spacing="0.05em">ERROR HANDLING E RESILIÊNCIA COM RXJS</text>
</svg>