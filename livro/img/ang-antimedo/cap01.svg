<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0008"/>
      <stop offset="50%" stop-color="#9b1230"/>
      <stop offset="100%" stop-color="#3a0414"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f5b800"/>
    </linearGradient>
    <linearGradient id="angGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#dd1b44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo com gradiente suave -->
  <rect width="800" height="420" fill="url(#bg)"/>
  
  <!-- Grid tático de fundo -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- Conteúdo Central -->
  
        <!-- Bloco de Código Gigante vs Desenvolvedor Decidido -->
        <rect x="180" y="50" width="440" height="260" rx="16" fill="url(#cardGrad)" stroke="#dd1b44" stroke-width="2" filter="url(#shadow)"/>
        <circle cx="215" cy="80" r="6" fill="#ff5f56"/>
        <circle cx="235" cy="80" r="6" fill="#ffbd2e"/>
        <circle cx="255" cy="80" r="6" fill="#27c93f"/>
        <text x="215" y="130" font-family="'Cascadia Code',monospace" font-size="18" fill="#ff6b35" font-weight="700">@Component({</text>
        <text x="245" y="165" font-family="'Cascadia Code',monospace" font-size="16" fill="#ffffff">selector: 'app-antimedo',</text>
        <text x="245" y="195" font-family="'Cascadia Code',monospace" font-size="16" fill="#ffffff">standalone: true,</text>
        <text x="245" y="225" font-family="'Cascadia Code',monospace" font-size="16" fill="#f5b800">template: '&lt;h1&gt;Eu Sou Capaz&lt;/h1&gt;'</text>
        <text x="215" y="260" font-family="'Cascadia Code',monospace" font-size="18" fill="#ff6b35">})</text>
        <text x="215" y="290" font-family="'Cascadia Code',monospace" font-size="16" fill="#8bf">export class VencedorComponent {}</text>
        

  <!-- Rodapé com títulos -->
  <rect x="0" y="360" width="800" height="60" fill="#0c0004" opacity="0.6"/>
  <text x="40" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="0.02em">CAP. 1 · SEU MAIOR BLOQUEIO E O PROPÓSITO</text>
  <text x="760" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#ff6b35" text-anchor="end" letter-spacing="0.05em">DO MEDO AO PRIMEIRO COMPONENTE</text>
</svg>