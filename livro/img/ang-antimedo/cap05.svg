<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0008"/>
      <stop offset="50%" stop-color="#9b1230"/>
      <stop offset="100%" stop-color="#3a0414"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f5b800"/>
    </linearGradient>
    <linearGradient id="angGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#dd1b44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo com gradiente suave -->
  <rect width="800" height="420" fill="url(#bg)"/>
  
  <!-- Grid tático de fundo -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- Conteúdo Central -->
  
        <rect x="220" y="60" width="360" height="240" rx="14" fill="#200610" stroke="#dd1b44" stroke-width="2" filter="url(#shadow)"/>
        <text x="250" y="100" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#fff">Inventário de Medos</text>
        <rect x="250" y="120" width="300" height="34" rx="6" fill="#120208" stroke="#2e9e6b" stroke-width="2"/>
        <text x="265" y="142" font-family="'Segoe UI',sans-serif" font-size="13" fill="#fff">Medo de falar em público</text>
        <text x="530" y="142" font-family="'Segoe UI',sans-serif" font-size="14" fill="#2e9e6b">✓</text>
        <rect x="250" y="170" width="300" height="34" rx="6" fill="#120208" stroke="#dd1b44" stroke-width="2"/>
        <text x="265" y="192" font-family="'Segoe UI',sans-serif" font-size="13" fill="#aaa">vago...</text>
        <text x="530" y="192" font-family="'Segoe UI',sans-serif" font-size="14" fill="#dd1b44">✗</text>
        <text x="250" y="222" font-family="'Segoe UI',sans-serif" font-size="11" fill="#dd1b44">Validators.minLength(5) violado</text>
        <rect x="250" y="245" width="120" height="36" rx="6" fill="#dd1b44"/>
        <text x="310" y="268" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">VALIDAR</text>
        

  <!-- Rodapé com títulos -->
  <rect x="0" y="360" width="800" height="60" fill="#0c0004" opacity="0.6"/>
  <text x="40" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="0.02em">CAP. 5 · QUAIS SÃO OS SEUS MEDOS?</text>
  <text x="760" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#ff6b35" text-anchor="end" letter-spacing="0.05em">FORMULÁRIOS REATIVOS E VALIDAÇÃO</text>
</svg>