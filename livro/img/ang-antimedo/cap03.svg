<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0008"/>
      <stop offset="50%" stop-color="#9b1230"/>
      <stop offset="100%" stop-color="#3a0414"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f5b800"/>
    </linearGradient>
    <linearGradient id="angGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#dd1b44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo com gradiente suave -->
  <rect width="800" height="420" fill="url(#bg)"/>
  
  <!-- Grid tático de fundo -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- Conteúdo Central -->
  
        <g transform="translate(240, 170)">
          <rect x="-160" y="-90" width="320" height="180" rx="14" fill="#300" stroke="#f44" stroke-width="2" opacity="0.8"/>
          <text x="0" y="-50" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#f88" text-anchor="middle">MEDO TÓXICO: Default</text>
          <text x="0" y="-10" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ddd" text-anchor="middle">Reage a qualquer faísca</text>
          <text x="0" y="15" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ddd" text-anchor="middle">Varre a árvore inteira</text>
          <text x="0" y="45" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#ff7b86" text-anchor="middle">Sobrecarga &amp; Paralisia</text>
        </g>
        <g transform="translate(560, 170)">
          <rect x="-160" y="-90" width="320" height="180" rx="14" fill="#032" stroke="#2e9e6b" stroke-width="2"/>
          <text x="0" y="-50" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#8fd" text-anchor="middle">PRUDÊNCIA: OnPush</text>
          <text x="0" y="-10" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ddd" text-anchor="middle">Só reage se @Input mudar</text>
          <text x="0" y="15" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ddd" text-anchor="middle">Imutabilidade &amp; Controle</text>
          <text x="0" y="45" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#2e9e6b" text-anchor="middle">Alta Performance</text>
        </g>
        

  <!-- Rodapé com títulos -->
  <rect x="0" y="360" width="800" height="60" fill="#0c0004" opacity="0.6"/>
  <text x="40" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="0.02em">CAP. 3 · MEDO X MEDO</text>
  <text x="760" y="396" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#ff6b35" text-anchor="end" letter-spacing="0.05em">PRUDÊNCIA VS. PARALISIA (ONPUSH)</text>
</svg>