<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Um laptop mostrando a saída de um roteiro fictício no console, com um escudo que indica dados somente em memória" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Arial,sans-serif"><defs><linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#e3eded'/><stop offset='1' stop-color='#c5dad9'/></linearGradient><filter id='sombra' x='-10%' y='-10%' width='125%' height='135%'><feDropShadow dx='0' dy='3' stdDeviation='3' flood-color='#1f2430' flood-opacity='.22'/></filter></defs><rect width='800' height='420' rx='22' fill='url(#bg)'/><circle cx='740' cy='40' r='150' fill='#e47750' opacity='.13'/><circle cx='40' cy='410' r='130' fill='#176b68' opacity='.10'/><rect x='0' y='358' width='800' height='62' rx='22' fill='#176b68' opacity='.16'/><rect x='0' y='358' width='800' height='62' fill='#176b68' opacity='0'/><rect x="70" y="50" width="460" height="250" rx="12" fill="#102624" stroke="#1f2430" stroke-width="3.5" filter="url(#sombra)"/><path d="M70,80 L70,62 Q70,50 82,50 L518,50 Q530,50 530,62 L530,80 Z" fill="#176b68" stroke="#1f2430" stroke-width="3.5"/><circle cx="88" cy="65" r="5" fill="#ff6b6b" stroke="none" stroke-width="3"/><circle cx="104" cy="65" r="5" fill="#ffd166" stroke="none" stroke-width="3"/><circle cx="120" cy="65" r="5" fill="#6bd36b" stroke="none" stroke-width="3"/><text x="314.0" y="70" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Emocoes.Console</text><text x="92" y="106" font-size="14" font-weight="700" fill="#bfe9e3" text-anchor="start">Exemplo fictício — roteiro educativo, sem avaliação.</text><text x="92" y="138" font-size="14" font-weight="700" fill="#bfe9e3" text-anchor="start">Sinal observado: a revisão terminou sem responsáveis.</text><text x="92" y="170" font-size="14" font-weight="700" fill="#bfe9e3" text-anchor="start">Palavra escolhida: Frustração</text><text x="92" y="202" font-size="14" font-weight="700" fill="#bfe9e3" text-anchor="start">Opção escolhida: Pedir um intervalo</text><text x="92" y="234" font-size="14" font-weight="700" fill="#bfe9e3" text-anchor="start">Próximo passo: retomar depois do almoço.</text><text x="92" y="266" font-size="14" font-weight="700" fill="#bfe9e3" text-anchor="start">Pedido: avisar antes de substituir o arquivo.</text><g transform="translate(660 140) scale(1.6)"><path d="M0,-38 L32,-26 L32,6 Q32,30 0,44 Q-32,30 -32,6 L-32,-26 Z" fill="#176b68" stroke="#0f4644" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M0,-30 L24,-21 L24,6 Q24,24 0,35 Q-24,24 -24,6 L-24,-21 Z" fill="#51908e" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="11" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">RAM</text></g><rect x="591.4" y="217.8" width="137.2" height="28.5" rx="14.2" fill="#176b68"/><text x="660" y="236.95" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">só em memória</text><rect x="147.4" y="321.8" width="305.2" height="28.5" rx="14.2" fill="#8a2a4a"/><text x="300" y="340.95" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">sem arquivos, sem rede, sem notas</text><g transform="translate(670 356) scale(0.55 0.55)"><rect x="-17" y="-58" width="14" height="58" rx="7" fill="#34405a"/><ellipse cx="-13" cy="0" rx="13" ry="6" fill="#2a2d3a" stroke="none" stroke-width="3"/><rect x="3" y="-58" width="14" height="58" rx="7" fill="#34405a"/><ellipse cx="13" cy="0" rx="13" ry="6" fill="#2a2d3a" stroke="none" stroke-width="3"/><line x1="-30" y1="-118" x2="-43.1" y2="-65.6" stroke="#e47750" stroke-width="15" stroke-linecap="round"/><circle cx="-43.1" cy="-65.6" r="8.5" fill="#e0ac80" stroke="none" stroke-width="3"/><line x1="30" y1="-118" x2="66.1" y2="-77.9" stroke="#e47750" stroke-width="15" stroke-linecap="round"/><circle cx="66.1" cy="-77.9" r="8.5" fill="#e0ac80" stroke="none" stroke-width="3"/><rect