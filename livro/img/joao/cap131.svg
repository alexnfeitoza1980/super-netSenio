<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Uma linha do tempo com cinco eventos do relato (faleceu, pedra tirada, chamado, saiu, desatado) que acendem em ordem, e um cursor que mostra o estado em cada momento" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Arial,sans-serif"><defs><linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#e4e8ef'/><stop offset='1' stop-color='#c6cfde'/></linearGradient><filter id='sombra' x='-10%' y='-10%' width='125%' height='135%'><feDropShadow dx='0' dy='3' stdDeviation='3' flood-color='#1f2430' flood-opacity='.22'/></filter></defs><style>
.gira{transform-box:fill-box;transform-origin:center;animation:gira var(--d,30s) linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.pulsa{transform-box:fill-box;transform-origin:center;animation:pulsa var(--d,3s) ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.flutua{animation:flutua var(--d,4s) ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.sobe{animation:sobe var(--d,8s) ease-out infinite backwards}
@keyframes sobe{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}
.onda{transform-box:fill-box;transform-origin:center;animation:onda var(--d,3s) ease-out infinite backwards}
@keyframes onda{0%{transform:scale(.25);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.seq{animation:seq var(--d,12s) ease infinite backwards}
@keyframes seq{0%{opacity:0}5%{opacity:1}86%{opacity:1}96%,100%{opacity:0}}
.brilha{transform-box:fill-box;transform-origin:center;animation:brilha var(--d,12s) ease-in-out infinite}
@keyframes brilha{0%,100%{transform:scale(1)}6%{transform:scale(1.12)}14%{transform:scale(1)}}
.corre{offset-rotate:0deg;animation:corre var(--d,6s) linear infinite backwards}
@keyframes corre{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.marcha{stroke-dasharray:14 12;animation:marcha var(--d,2s) linear infinite}
@keyframes marcha{to{stroke-dashoffset:-52}}
.desenha{stroke-dasharray:var(--l,600);stroke-dashoffset:var(--l,600);animation:desenha var(--d,6s) ease-in-out infinite}
@keyframes desenha{0%{stroke-dashoffset:var(--l,600)}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--l,600)}}
.brota{transform-box:fill-box;transform-origin:center;animation:brota var(--d,8s) ease-out infinite backwards}
@keyframes brota{0%,10%{transform:scale(0);opacity:0}30%{transform:scale(1.15);opacity:1}38%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.cresce{transform-box:fill-box;transform-origin:50% 100%;animation:cresce var(--d,8s) ease-out infinite backwards}
@keyframes cresce{0%{transform:scaleY(0)}35%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.varre{animation:varre var(--d,12s) ease-in-out infinite}
@keyframes varre{0%{transform:translateX(0);opacity:0}6%{opacity:1}80%{transform:translateX(var(--dx,600px));opacity:1}90%,100%{transform:translateX(var(--dx,600px));opacity:0}}
.vinho{animation:vinho var(--d,12s) ease-in-out infinite}
@keyframes vinho{0%,12%{fill:#6bb6e8}38%,86%{fill:#8e1f3d}100%{fill:#6bb6e8}}
.poco{animation:poco var(--d,6s) ease-in-out infinite}
@keyframes poco{0%,100%{transform:translateY(0)}50%{transform:translateY(78px)}}
.corda{transform-box:fill-box;transform-origin:50% 0;animation:corda var(--d,6s) ease-in-out infinite}
@keyframes corda{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.6)}}
.encolhe{transform-box:fill-box;transform-origin:0 50%;animation:encolhe var(--d,10s) linear infinite}
@keyframes encolhe{0%{transform:scaleX(1)}80%,100%{transform:scaleX(0)}}
.solta{animation:solta var(--d,12s) ease infinite}
@keyframes solta{0%,45%{opacity:1}60%,100%{opacity:0}}
.entra{animation:entra var(--d,12s) ease infinite}
@keyframes entra{0%,45%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
.varre2{animation:varre2 var(--d,12s) linear infinite}
@keyframes varre2{0%{transform:translateX(0);opacity:0}4%{transform:translateX(0);opacity:1}85%{transform:translateX(var(--dx,600px));opacity:1}96%,100%{transform:translateX(var(--dx,600px));opacity:0}}
.s_ativo{animation:s_ativo var(--d,12s) linear infinite}
@keyframes s_ativo{0%,3%{opacity:0}5%,44%{opacity:1}45%,100%{opacity:0}}
.s_arq{animation:s_arq var(--d,12s) linear infinite}
@keyframes s_arq{0%,44%{opacity:0}45%,64%{opacity:1}65%,100%{opacity:0}}
.s_cham{animation:s_cham var(--d,12s) linear infinite}
@keyframes s_cham{0%,64%{opacity:0}65%,84%{opacity:1}85%,100%{opacity:0}}
.s_livre{animation:s_livre var(--d,12s) linear infinite}
@keyframes s_livre{0%,84%{opacity:0}85%,97%{opacity:1}98%,100%{opacity:0}}
.s_band{animation:s_band var(--d,12s) linear infinite}
@keyframes s_band{0%,64%{opacity:0}65%,84%{opacity:1}85%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
 .gira,.pulsa,.flutua,.sobe,.onda,.seq,.brilha,.marcha,.desenha,.brota,.cresce,.varre,.varre2,.vinho,.poco,.corda,.encolhe,.solta,.entra{animation:none!important}
 .s_ativo,.s_arq,.s_cham{animation:none!important;opacity:0}
 .s_livre{animation:none!important;opacity:1}
 .s_band{animation:none!important;opacity:0}
 .corre,.sobe,.onda,.varre,.varre2{display:none}
 .desenha{stroke-dashoffset:0!important}
}
</style><rect width='800' height='420' rx='22' fill='url(#bg)'/><circle cx='740' cy='40' r='150' fill='#d99a14' opacity='.13'/><circle cx='40' cy='410' r='130' fill='#1c3f7a' opacity='.10'/><rect x='0' y='358' width='800' height='62' rx='22' fill='#1c3f7a' opacity='.16'/><rect x='0' y='358' width='800' height='62' fill='#1c3f7a' opacity='0'/><text font-family="Consolas,'Cascadia Mono','Courier New',monospace" x="400" y="40" font-size="22" font-weight="900" fill="#1c3f7a" text-anchor="middle">Estado = Aggregate(eventos)</text><rect x="330" y="62" width="140" height="150" rx="14" fill="#fff" stroke="#1c3f7a" stroke-width="4" filter="url(#sombra)"/><line x1="350" y1="92" x2="450" y2="92" stroke="#c5cde0" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="114" x2="450" y2="114" stroke="#c5cde0" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="136" x2="450" y2="136" stroke="#c5cde0" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="158" x2="450" y2="158" stroke="#c5cde0" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="180" x2="450" y2="180" stroke="#c5cde0" stroke-width="4" stroke-linecap="round"/><g class="s_band" style="--d:12s"><rect x="324" y="110" width="152" height="22" rx="6" fill="#d8d2c4" stroke="#1f2430" stroke-width="2.5" transform="rotate(-8 400 121)"/><rect x="324" y="156" width="152" height="22" rx="6" fill="#d8d2c4" stroke="#1f2430" stroke-width="2.5" transform="rotate(7 400 167)"/></g><g class="s_livre" style="--d:12s"><g transform="translate(400 140) scale(1.4)"><circle cx="0" cy="0" r="22" fill="#2e9e6b" stroke="none" stroke-width="3"/><path d="M-10,1 L-3,9 L11,-8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g></g><g class="s_ativo" style="--d:12s"><rect x="363.6" y="224.8" width="72.8" height="30.4" rx="15.2" fill="#8892a6"/><text x="400" y="245.28" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Morto</text></g><g class="s_arq" style="--d:12s"><rect x="354.6" y="224.8" width="90.7" height="30.4" rx="15.2" fill="#e0a526"/><text x="400" y="245.28" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Chamado</text></g><g class="s_cham" style="--d:12s"><rect x="305.4" y="224.8" width="189.3" height="30.4" rx="15.2" fill="#d8454f"/><text x="400" y="245.28" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Vivo · ainda atado</text></g><g class="s_livre" style="--d:12s"><rect x="332.2" y="224.8" width="135.5" height="30.4" rx="15.2" fill="#2e9e6b"/><text x="400" y="245.28" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Vivo · livre</text></g><line x1="60" y1="320" x2="740" y2="320" stroke="#8892a6" stroke-width="5" stroke-linecap="round"/><g class="brilha" style="--d:12s;animation-delay:0.6s"><circle cx="100" cy="320" r="17" fill="#8892a6" stroke="#1f2430" stroke-width="3.5"/></g><text x="100" y="360" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">Faleceu</text><text x="100" y="380" font-size="12" font-weight="600" fill="#6e7f9f" text-anchor="middle">09:00</text><g class="brilha" style="--d:12s;animation-delay:3.0s"><circle cx="250" cy="320" r="17" fill="#2f7fd6" stroke="#1f2430" stroke-width="3.5"/></g><text x="250" y="360" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">Pedra tirada</text><text x="250" y="380" font-size="12" font-weight="600" fill="#6e7f9f" text-anchor="middle">09:10</text><g class="brilha" style="--d:12s;animation-delay:5.4s"><circle cx="400" cy="320" r="17" fill="#e0a526" stroke="#1f2430" stroke-width="3.5"/></g><text x="400" y="360" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">Chamado</text><text x="400" y="380" font-size="12" font-weight="600" fill="#6e7f9f" text-anchor="middle">09:20</text><g class="brilha" style="--d:12s;animation-delay:7.8s"><circle cx="550" cy="320" r="17" fill="#d8454f" stroke="#1f2430" stroke-width="3.5"/></g><text x="550" y="360" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">Saiu</text><text x="550" y="380" font-size="12" font-weight="600" fill="#6e7f9f" text-anchor="middle">09:21</text><g class="brilha" style="--d:12s;animation-delay:10.2s"><circle cx="700" cy="320" r="17" fill="#2e9e6b" stroke="#1f2430" stroke-width="3.5"/></g><text x="700" y="360" font-size="15" font-weight="800" fill="#1f2430" text-anchor="middle">Desatado</text><text x="700" y="380" font-size="12" font-weight="600" fill="#6e7f9f" text-anchor="middle">09:22</text><g class="varre2" style="--d:12s;--dx:600px"><rect x="97" y="262" width="6" height="86" rx="3" fill="#e0a526"/><path d="M90,262 L110,262 L100,248 Z" fill="#e0a526"/></g><rect x="55.0" y="258.7" width="129.9" height="26.6" rx="13.3" fill="#7a5bd6"/><text x="120" y="276.62" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">EstadoEm(...)</text><text x="400" y="406" font-size="14" font-weight="800" fill="#2e9e6b" text-anchor="middle">nenhum evento se apaga: o estado é a soma dos eventos</text></svg>