<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="À esquerda um mapa com oito lugares ligados por caminhos e uma rota que se destaca; à direita um gráfico de barras da palavra menō por capítulo, com o capítulo 15 em destaque" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,Arial,sans-serif"><defs><linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#e4e8ef'/><stop offset='1' stop-color='#c6cfde'/></linearGradient><filter id='sombra' x='-10%' y='-10%' width='125%' height='135%'><feDropShadow dx='0' dy='3' stdDeviation='3' flood-color='#1f2430' flood-opacity='.22'/></filter></defs><style>
.gira{transform-box:fill-box;transform-origin:center;animation:gira var(--d,30s) linear infinite}
