.seq{animation:seq var(--d,12s) ease infinite backwards}
@keyframes seq{0%{opacity:0}5%{opacity:1}86%{opacity:1}96%,100%{opacity:0}}
.brilha{transform-box:fill-box;transform-origin:center;animation:brilha var(--d,12s) ease-in-out infinite}
@keyframes brilha{0%,100%{transform:scale(1)}6%{transform:scale(1.12)}14%{transform:scale(1)}}
.corre{offset-rotate:0deg;animation:corre var(--d,6s) linear infinite backwards}
