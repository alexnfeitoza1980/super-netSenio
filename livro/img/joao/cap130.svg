.pulsa{transform-box:fill-box;transform-origin:center;animation:pulsa var(--d,3s) ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.flutua{animation:flutua var(--d,4s) ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.sobe{animation:sobe var(--d,8s) ease-out infinite backwards}
@keyframes sobe{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}
.onda{transform-box:fill-box;transform-origin:center;animation:onda var(--d,3s) ease-out infinite backwards}
@keyframes onda{0%{transform:scale(.25);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.seq{animation:seq var(--d,12s) ease infinite backwards}
@keyframes seq{0%{opacity:0}5%{opacity:1}86%{opacity:1}96%,100%{opacity:0}}
.brilha{transform-box:fill-box;transform-origin:center;animation:brilha var(--d,12s) ease-in-out infinite}
@keyframes brilha{0%,100%{transform:scale(1)}6%{transform:scale(1.12)}14%{transform:scale(1)}}
.corre{offset-rotate:0deg;animation:corre var(--d,6s) linear infinite backwards}
@keyframes corre{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.marcha{stroke-dasharray:14 12;animation:marcha var(--d,2s) linear infinite}
@keyframes marcha{to{stroke-dashoffset:-52}}
.desenha{stroke-dasharray:var(--l,600);stroke-dashoffset:var(--l,600);animation:desenha var(--d,6s) ease-in-out infinite}
@keyframes desenha{0%{stroke-dashoffset:var(--l,600)}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--l,600)}}
.brota{transform-box:fill-box;transform-origin:center;animation:brota var(--d,8s) ease-out infinite backwards}
@keyframes brota{0%,10%{transform:scale(0);opacity:0}30%{transform:scale(1.15);opacity:1}38%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.cresce{transform-box:fill-box;transform-origin:50% 100%;animation:cresce var(--d,8s) ease-out infinite backwards}
@keyframes cresce{0%{transform:scaleY(0)}35%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.varre{animation:varre var(--d,12s) ease-in-out infinite}
@keyframes varre{0%{transform:translateX(0);opacity:0}6%{opacity:1}80%{transform:translateX(var(--dx,600px));opacity:1}90%,100%{transform:translateX(var(--dx,600px));opacity:0}}
.vinho{animation:vinho var(--d,12s) ease-in-out infinite}
@keyframes vinho{0%,12%{fill:#6bb6e8}38%,86%{fill:#8e1f3d}100%{fill:#6bb6e8}}
.poco{animation:poco var(--d,6s) ease-in-out infinite}
@keyframes poco{0%,100%{transform:translateY(0)}50%{transform:translateY(78px)}}
.corda{transform-box:fill-box;transform-origin:50% 0;animation:corda var(--d,6s) ease-in-out infinite}
@keyframes corda{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.6)}}
.encolhe{transform-box:fill-box;transform-origin:0 50%;animation:encolhe var(--d,10s) linear infinite}
@keyframes encolhe{0%{transform:scaleX(1)}80%,100%{transform:scaleX(0)}}
.solta{animation:solta var(--d,12s) ease infinite}
@keyframes solta{0%,45%{opacity:1}60%,100%{opacity:0}}
.entra{animation:entra var(--d,12s) ease infinite}
@keyframes entra{0%,45%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
.varre2{animation:varre2 var(--d,12s) linear infinite}
@keyframes varre2{0%{transform:translateX(0);opacity:0}4%{transform:translateX(0);opacity:1}85%{transform:translateX(var(--dx,600px));opacity:1}96%,100%{transform:translateX(var(--dx,600px));opacity:0}}
.s_ativo{animation:s_ativo var(--d,12s) linear infinite}
