.desenha{stroke-dasharray:var(--l,600);stroke-dashoffset:var(--l,600);animation:desenha var(--d,6s) ease-in-out infinite}
@keyframes desenha{0%{stroke-dashoffset:var(--l,600)}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--l,600)}}
.brota{transform-box:fill-box;transform-origin:center;animation:brota var(--d,8s) ease-out infinite backwards}
