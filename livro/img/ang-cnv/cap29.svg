<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d96b27" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140803"/>
      <stop offset="60%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#180a04"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
  </defs>

  <!-- Fundo de Studio da Ilustração -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid tático refinado -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/><line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Halo de luz quente -->
  <circle cx="480" cy="270" r="320" fill="#f59e0b" opacity="0.06" filter="blur(60px)"/>

  
  <!-- Comparativo de Concorrência: Sem switchMap vs Com switchMap -->
  <g transform="translate(40, 30)" filter="url(#winShadow)">
    <rect width="880" height="480" rx="10" fill="#181825"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#11111b"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="310" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="440" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Desarmamento de Concorrência — switchMap &amp; exhaustMap</text>
    

    <g transform="translate(30, 60)">
      <!-- Lado Esquerdo: Sem switchMap (Race Condition Tóxica) -->
      <g transform="translate(0, 0)">
        <rect width="395" height="390" rx="8" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5"/>
        <rect width="395" height="30" rx="8" fill="rgba(239, 68, 68, 0.2)"/>
        <text x="14" y="20" font-family="system-ui" font-weight="bold" font-size="11" fill="#f38ba8">SEM switchMap: Concorrência Hostil</text>

        <g transform="translate(16, 45)" font-family="system-ui" font-size="11">
          <text y="16" fill="#f38ba8">Disparos impulsivos do usuário:</text>
          
          <rect y="30" width="360" height="40" rx="6" fill="#11111b"/>
          <text x="12" y="54" font-family="monospace" font-size="10" fill="#f38ba8">Req 1: 'medo' ➔ Demora 800ms</text>

          <rect y="80" width="360" height="40" rx="6" fill="#11111b"/>
          <text x="12" y="104" font-family="monospace" font-size="10" fill="#a6e3a1">Req 2: 'amor' ➔ Chega em 200ms (RENDERIZOU)</text>

          <rect y="130" width="360" height="40" rx="6" fill="#11111b"/>
          <text x="12" y="154" font-family="monospace" font-size="10" fill="#ef4444">Req 1 chega depois e SOBRESCREVE a tela!</text>

          <g transform="translate(0, 190)">
            <rect width="360" height="120" rx="6" fill="rgba(239, 68, 68, 0.1)" stroke="#ef4444" stroke-width="1"/>
            <text x="14" y="24" font-weight="bold" fill="#f38ba8">Resultado Desastroso:</text>
            <text x="14" y="46" fill="#fca5a5">• Usuário pesquisou por 'amor'</text>
            <text x="14" y="66" fill="#fca5a5">• A tela exibe resultados de 'medo'</text>
            <text x="14" y="86" fill="#fca5a5">• Raiva, frustração e quebra de confiança</text>
          </g>
        </g>
      </g>

      <!-- Lado Direito: Com switchMap (Paz e Cancelamento Consciente) -->
      <g transform="translate(425, 0)">
        <rect width="395" height="390" rx="8" fill="#1e1e2e" stroke="#10b981" stroke-width="1.5"/>
        <rect width="395" height="30" rx="8" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="14" y="20" font-family="system-ui" font-weight="bold" font-size="11" fill="#a6e3a1">COM switchMap: Desarmamento Serena</text>

        <g transform="translate(16, 45)" font-family="system-ui" font-size="11">
          <text y="16" fill="#a6e3a1">Cancelamento automático de requisição antiga:</text>
          
          <rect y="30" width="360" height="40" rx="6" fill="#11111b"/>
          <text x="12" y="54" font-family="monospace" font-size="10" fill="#6c7086">Req 1: 'medo' ➔ CANCELADA (ERR_ABORTED)</text>

          <rect y="80" width="360" height="40" rx="6" fill="#11111b"/>
          <text x="12" y="104" font-family="monospace" font-size="10" fill="#a6e3a1">Req 2: 'amor' ➔ Ativa e Acolhida ✓</text>

          <g transform="translate(0, 140)">
            <rect width="360" height="170" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1"/>
            <text x="14" y="24" font-weight="bold" fill="#a6e3a1">A Sabedoria da Raiva (Marshall):</text>
            <text x="14" y="48" fill="#cdd6f4">"A raiva nos avisa que nos desconectamos</text>
            <text x="14" y="66" fill="#cdd6f4">de nossas necessidades. Desarmar a</text>
            <text x="14" y="84" fill="#cdd6f4">concorrência previne o caos na tela."</text>
            <text x="14" y="112" fill="#a6e3a1">• exhaustMap protege cliques repetidos</text>
            <text x="14" y="130" fill="#a6e3a1">• Apenas a última intenção é renderizada</text>
          </g>
        </g>
      </g>
    </g>
  </g>

</svg>