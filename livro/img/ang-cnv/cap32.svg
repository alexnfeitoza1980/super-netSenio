<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d96b27" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140803"/>
      <stop offset="60%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#180a04"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
  </defs>

  <!-- Fundo de Studio da Ilustração -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid tático refinado -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/><line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Halo de luz quente -->
  <circle cx="480" cy="270" r="320" fill="#f59e0b" opacity="0.06" filter="blur(60px)"/>

  
  <!-- Dashboard com Toast Flutuante baseado nos 3 Pilares da Apreciação -->
  <g transform="translate(40, 30)" filter="url(#winShadow)">
    <rect width="880" height="480" rx="10" fill="#fffaf5"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#fdf4eb"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="310" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="440" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">app.compassivo.dev/dashboard — Apreciação Genuína na UI</text>
    

    <!-- Conteúdo do Dashboard de Fundo -->
    <g transform="translate(40, 60)" opacity="0.6">
      <rect width="800" height="100" rx="8" fill="#ffffff" stroke="#f5dfd0" stroke-width="1"/>
      <text x="24" y="36" font-family="system-ui" font-weight="bold" font-size="16" fill="#2a1508">Painel de Conciliações e Diálogo</text>
      <text x="24" y="60" font-family="system-ui" font-size="11" fill="#6c3c1e">3 processos ativos • 1 concluído hoje</text>
    </g>

    <!-- O Toast Compassivo em Primeiro Plano (Destacado) -->
    <g transform="translate(240, 200)" filter="url(#winShadow)">
      <rect width="480" height="180" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <rect width="8" height="180" rx="4" fill="#10b981"/>

      <g transform="translate(30, 25)">
        <circle cx="20" cy="20" r="18" fill="#ecfdf5"/>
        <text x="20" y="27" font-family="system-ui" font-size="20" text-anchor="middle">🎉</text>

        <text x="54" y="22" font-family="system-ui" font-weight="bold" font-size="14" fill="#065f46">
          Apreciação Concreta: Diálogo Concluído com Sucesso!
        </text>

        <!-- Os 3 Elementos da Apreciação de Marshall Rosenberg -->
        <g transform="translate(54, 45)" font-family="system-ui" font-size="11">
          <text y="14" fill="#2a1508">
            <tspan font-weight="bold" fill="#047857">1. Fato Concreto:</tspan> O acordo de prazo do sprint foi assinado por ambas as partes.
          </text>
          <text y="34" fill="#2a1508">
            <tspan font-weight="bold" fill="#047857">2. Necessidade Atendida:</tspan> Clareza, previsibilidade e descanso no fim de semana.
          </text>
          <text y="54" fill="#2a1508">
            <tspan font-weight="bold" fill="#047857">3. Sentimento Resultante:</tspan> Alívio genuíno, alegria e confiança mútua fortalecida.
          </text>
        </g>

        <!-- Botão de Fechar e Barra de Progresso do Toast -->
        <rect x="54" y="125" width="370" height="4" rx="2" fill="#e2e8f0"/>
        <rect x="54" y="125" width="240" height="4" rx="2" fill="#10b981"/>
      </g>
    </g>
  </g>

</svg>