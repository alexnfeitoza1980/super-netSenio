<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d96b27" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140803"/>
      <stop offset="60%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#180a04"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
  </defs>

  <!-- Fundo de Studio da Ilustração -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid tático refinado -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/><line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Halo de luz quente -->
  <circle cx="480" cy="270" r="320" fill="#f59e0b" opacity="0.06" filter="blur(60px)"/>

  
  <!-- Visualizador de Streams RxJS: Sem Interrupção Ansiosa -->
  <g transform="translate(40, 30)" filter="url(#winShadow)">
    <rect width="880" height="480" rx="10" fill="#181825"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#11111b"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="310" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="440" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">RxJS DevTools — Escuta Ativa sem Ansiedade de Interrupção</text>
    

    <g transform="translate(30, 50)">
      <text x="0" y="20" font-family="system-ui" font-weight="bold" font-size="14" fill="#ffffff">Acolhendo a Fala do Usuário com debounceTime e distinctUntilChanged</text>
      <text x="0" y="40" font-family="system-ui" font-size="11" fill="#a6adc8">O sistema respeita o ritmo humano de digitação, sem disparos prematuros nem interrupções ríspidas.</text>

      <!-- Linha do Tempo 1: Digitação Apressada do Usuário -->
      <g transform="translate(0, 70)">
        <rect width="820" height="70" rx="8" fill="#1e1e2e"/>
        <text x="16" y="24" font-family="system-ui" font-weight="bold" font-size="11" fill="#f38ba8">1. Digitação do Usuário (Eventos de Tecla)</text>
        <line x1="16" y1="46" x2="800" y2="46" stroke="#45475a" stroke-width="2"/>
        
        <!-- Letras digitadas rapidamente -->
        <circle cx="100" cy="46" r="12" fill="#f38ba8"/>
        <text x="100" y="50" font-family="system-ui" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">c</text>

        <circle cx="140" cy="46" r="12" fill="#f38ba8"/>
        <text x="140" y="50" font-family="system-ui" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">co</text>

        <circle cx="180" cy="46" r="12" fill="#f38ba8"/>
        <text x="180" y="50" font-family="system-ui" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">com</text>

        <circle cx="230" cy="46" r="14" fill="#f38ba8"/>
        <text x="230" y="50" font-family="system-ui" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">comp</text>

        <circle cx="310" cy="46" r="16" fill="#f38ba8"/>
        <text x="310" y="50" font-family="system-ui" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">compaixão</text>

        <text x="440" y="49" font-family="system-ui" font-size="10" fill="#6c7086">(Usuário fez uma pausa para pensar)</text>
      </g>

      <!-- Linha do Tempo 2: Janela de Silêncio Respeitoso (debounceTime) -->
      <g transform="translate(0, 160)">
        <rect width="820" height="70" rx="8" fill="#1e1e2e"/>
        <text x="16" y="24" font-family="system-ui" font-weight="bold" font-size="11" fill="#f59e0b">2. Janela de Silêncio Ativo (debounceTime 300ms)</text>
        <line x1="16" y1="46" x2="800" y2="46" stroke="#45475a" stroke-width="2"/>

        <!-- Janela de espera -->
        <rect x="310" y="32" width="160" height="28" rx="6" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1"/>
        <text x="390" y="50" font-family="system-ui" font-size="10" font-weight="bold" fill="#f9e2af" text-anchor="middle">300ms de silêncio respeitoso</text>
        <text x="500" y="50" font-family="system-ui" font-size="10" fill="#a6adc8">Esperando o humano terminar a fala...</text>
      </g>

      <!-- Linha do Tempo 3: Emissão Única Serena -->
      <g transform="translate(0, 250)">
        <rect width="820" height="70" rx="8" fill="#1e1e2e"/>
        <text x="16" y="24" font-family="system-ui" font-weight="bold" font-size="11" fill="#10b981">3. Emissão Pacífica para a API (switchMap)</text>
        <line x1="16" y1="46" x2="800" y2="46" stroke="#45475a" stroke-width="2"/>

        <circle cx="470" cy="46" r="18" fill="#10b981" filter="url(#winShadow)"/>
        <text x="470" y="51" font-family="system-ui" font-size="14" fill="#fff" text-anchor="middle">✓</text>
        <text x="510" y="50" font-family="monospace" font-size="11" fill="#a6e3a1">GET /api/topicos?termo=compaixão (UMA única chamada!)</text>
      </g>

      <!-- Resumo Pedagógico CNV -->
      <g transform="translate(0, 340)">
        <rect width="820" height="70" rx="8" fill="#11111b" stroke="#313244" stroke-width="1"/>
        <text x="20" y="28" font-family="system-ui" font-weight="bold" font-size="11" fill="#f9e2af">O Paralelo Humano:</text>
        <text x="20" y="48" font-family="system-ui" font-size="11" fill="#cdd6f4">
          Assim como na conversa humana não devemos interromper a fala alheia a cada sílaba para dar conselhos
          precipitados, a interface não deve bombardear a rede nem piscar a tela enquanto o usuário ainda está digitando.
        </text>
      </g>
    </g>
  </g>

</svg>