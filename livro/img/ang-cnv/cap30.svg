<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d96b27" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140803"/>
      <stop offset="60%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#180a04"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
  </defs>

  <!-- Fundo de Studio da Ilustração -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid tático refinado -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/><line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Halo de luz quente -->
  <circle cx="480" cy="270" r="320" fill="#f59e0b" opacity="0.06" filter="blur(60px)"/>

  
  <!-- Route Guard Dialog &amp; DomSanitizer XSS Protection -->
  <g transform="translate(40, 30)" filter="url(#winShadow)">
    <rect width="880" height="480" rx="10" fill="#181825"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#11111b"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="310" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="440" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Proteção sem Punição — Route Guards &amp; DomSanitizer</text>
    

    <g transform="translate(30, 60)">
      <!-- 1. canDeactivate: Guarda de Rota Protetor -->
      <g transform="translate(0, 0)">
        <rect width="400" height="390" rx="8" fill="#1e1e2e" stroke="#f97316" stroke-width="1.5"/>
        <rect width="400" height="30" rx="8" fill="rgba(249, 115, 22, 0.2)"/>
        <text x="14" y="20" font-family="system-ui" font-weight="bold" font-size="11" fill="#f97316">1. canDeactivateFn — Força Protetora</text>

        <!-- Diálogo Real do Navegador -->
        <g transform="translate(20, 50)">
          <rect width="360" height="150" rx="8" fill="#ffffff" filter="url(#winShadow)"/>
          <text x="20" y="32" font-family="system-ui" font-weight="bold" font-size="13" fill="#0f172a">Deseja realmente sair da página?</text>
          <text x="20" y="56" font-family="system-ui" font-size="11" fill="#475569">Existem reflexões não salvas neste formulário.</text>
          <text x="20" y="74" font-family="system-ui" font-size="11" fill="#475569">Se sair agora, seus pensamentos serão perdidos.</text>

          <rect x="180" y="96" width="80" height="32" rx="6" fill="#f1f5f9"/>
          <text x="220" y="116" font-family="system-ui" font-weight="600" font-size="11" fill="#334155" text-anchor="middle">Sair</text>

          <rect x="270" y="96" width="80" height="32" rx="6" fill="#d96b27"/>
          <text x="310" y="116" font-family="system-ui" font-weight="bold" font-size="11" fill="#fff" text-anchor="middle">Permanecer</text>
        </g>

        <g transform="translate(20, 220)" font-family="system-ui" font-size="10" fill="#bac2de">
          <text y="14" font-weight="bold" fill="#f97316">Por que é Força Protetora e Não Punitiva?</text>
          <text y="34">• Não insulta quem tentou sair</text>
          <text y="52">• Não deleta a conta do usuário</text>
          <text y="70">• Preserva a integridade do trabalho alheio</text>
        </g>
      </g>

      <!-- 2. DomSanitizer: Neutralizando XSS -->
      <g transform="translate(425, 0)">
        <rect width="395" height="390" rx="8" fill="#1e1e2e" stroke="#06b6d4" stroke-width="1.5"/>
        <rect width="395" height="30" rx="8" fill="rgba(6, 182, 212, 0.2)"/>
        <text x="14" y="20" font-family="system-ui" font-weight="bold" font-size="11" fill="#06b6d4">2. DomSanitizer — Neutralização de Ameaça</text>

        <g transform="translate(16, 50)" font-family="monospace" font-size="10">
          <text y="16" fill="#6c7086">// Entrada perigosa enviada por terceiro:</text>
          <rect y="26" width="360" height="42" rx="4" fill="#11111b"/>
          <text x="10" y="46" fill="#f38ba8">&lt;script&gt;roubarSessao();&lt;/script&gt;</text>
          <text x="10" y="60" fill="#a6e3a1">&lt;b&gt;Obrigado pela acolhida!&lt;/b&gt;</text>

          <text y="90" fill="#6c7086">// Higienização automática pelo Angular:</text>
          <rect y="100" width="360" height="42" rx="4" fill="#11111b"/>
          <text x="10" y="126" fill="#a6e3a1">&lt;b&gt;Obrigado pela acolhida!&lt;/b&gt;</text>

          <g transform="translate(0, 160)" font-family="system-ui" font-size="10" fill="#bac2de">
            <text y="14" font-weight="bold" fill="#06b6d4">Filosofia do DomSanitizer:</text>
            <text y="34">• Desarma o ataque XSS sem punir a mensagem</text>
            <text y="52">• O script hostil é neutralizado silenciosamente</text>
            <text y="70">• A mensagem de afeto permanece e é exibida</text>
          </g>
        </g>
      </g>
    </g>
  </g>

</svg>