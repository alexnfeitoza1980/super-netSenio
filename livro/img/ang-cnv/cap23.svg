<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d96b27" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140803"/>
      <stop offset="60%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#180a04"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
  </defs>

  <!-- Fundo de Studio da Ilustração -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid tático refinado -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/><line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Halo de luz quente -->
  <circle cx="480" cy="270" r="320" fill="#f59e0b" opacity="0.06" filter="blur(60px)"/>

  
  <!-- Matriz de 4 Estados da UI em cards realistas de interface -->
  <g transform="translate(30, 25)" filter="url(#winShadow)">
    <rect width="900" height="490" rx="10" fill="#1e1e2e"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 880 a 10,10 0 0 1 10,10 v 26 h -900 z" fill="#181825"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="320" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="450" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Matriz de Estados de UI — Vocabulário Emocional da Interface (@switch)</text>
    

    <!-- 4 Cards representando os 4 estados em alta fidelidade -->
    <!-- 1. IDLE -->
    <g transform="translate(30, 60)">
      <rect width="195" height="400" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="195" height="34" rx="8" fill="#f1f5f9"/>
      <circle cx="16" cy="17" r="4" fill="#94a3b8"/>
      <text x="28" y="21" font-family="system-ui" font-weight="bold" font-size="11" fill="#334155">1. ESTADO: IDLE</text>

      <g transform="translate(16, 50)" text-anchor="middle">
        <circle cx="81" cy="40" r="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <text x="81" y="48" font-family="system-ui" font-size="28">🌱</text>
        <text x="81" y="96" font-family="system-ui" font-weight="700" font-size="13" fill="#0f172a">Pronto para Ouvir</text>
        <text x="81" y="118" font-family="system-ui" font-size="10" fill="#64748b">A aplicação está em repouso</text>
        <text x="81" y="132" font-family="system-ui" font-size="10" fill="#64748b">aguardando sua intenção.</text>
      </g>

      <rect x="20" y="210" width="155" height="36" rx="6" fill="#d96b27"/>
      <text x="97" y="232" font-family="system-ui" font-weight="bold" font-size="11" fill="#fff" text-anchor="middle">Iniciar Conversa</text>

      <rect x="14" y="280" width="167" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="22" y="302" font-family="system-ui" font-size="10" font-weight="bold" fill="#334155">Expressão Honest:</text>
      <text x="22" y="322" font-family="system-ui" font-size="9" fill="#64748b">• Sem ansiedade precoce</text>
      <text x="22" y="340" font-family="system-ui" font-size="9" fill="#64748b">• Consumo nulo de rede</text>
      <text x="22" y="358" font-family="system-ui" font-size="9" fill="#64748b">• Presença pacífica</text>
    </g>

    <!-- 2. LOADING -->
    <g transform="translate(245, 60)">
      <rect width="195" height="400" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="195" height="34" rx="8" fill="#fef3c7"/>
      <circle cx="16" cy="17" r="4" fill="#f59e0b"/>
      <text x="28" y="21" font-family="system-ui" font-weight="bold" font-size="11" fill="#92400e">2. ESTADO: LOADING</text>

      <g transform="translate(16, 50)" text-anchor="middle">
        <circle cx="81" cy="40" r="28" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
        <text x="81" y="48" font-family="system-ui" font-size="28">⏳</text>
        <text x="81" y="96" font-family="system-ui" font-weight="700" font-size="13" fill="#92400e">Processando...</text>
        <text x="81" y="118" font-family="system-ui" font-size="10" fill="#b45309">Estamos consultando as</text>
        <text x="81" y="132" font-family="system-ui" font-size="10" fill="#b45309">diretrizes com carinho.</text>
      </g>

      <!-- Skeleton Bar -->
      <rect x="20" y="210" width="155" height="12" rx="4" fill="#e2e8f0"/>
      <rect x="20" y="228" width="110" height="12" rx="4" fill="#f1f5f9"/>

      <rect x="14" y="280" width="167" height="100" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="22" y="302" font-family="system-ui" font-size="10" font-weight="bold" fill="#92400e">Expressão Honest:</text>
      <text x="22" y="322" font-family="system-ui" font-size="9" fill="#92400e">• Feedback de esforço real</text>
      <text x="22" y="340" font-family="system-ui" font-size="9" fill="#92400e">• aria-busy="true"</text>
      <text x="22" y="358" font-family="system-ui" font-size="9" fill="#92400e">• Sem tela congelada</text>
    </g>

    <!-- 3. SUCCESS -->
    <g transform="translate(460, 60)">
      <rect width="195" height="400" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <rect width="195" height="34" rx="8" fill="#ecfdf5"/>
      <circle cx="16" cy="17" r="4" fill="#10b981"/>
      <text x="28" y="21" font-family="system-ui" font-weight="bold" font-size="11" fill="#065f46">3. ESTADO: SUCCESS</text>

      <g transform="translate(16, 50)" text-anchor="middle">
        <circle cx="81" cy="40" r="28" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
        <text x="81" y="48" font-family="system-ui" font-size="28">✨</text>
        <text x="81" y="96" font-family="system-ui" font-weight="700" font-size="13" fill="#047857">Conexão Realizada</text>
        <text x="81" y="118" font-family="system-ui" font-size="10" fill="#065f46">Sua mensagem foi acolhida</text>
        <text x="81" y="132" font-family="system-ui" font-size="10" fill="#065f46">pela equipe às 14:32.</text>
      </g>

      <rect x="20" y="210" width="155" height="36" rx="6" fill="#10b981"/>
      <text x="97" y="232" font-family="system-ui" font-weight="bold" font-size="11" fill="#fff" text-anchor="middle">Nova Interação</text>

      <rect x="14" y="280" width="167" height="100" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="22" y="302" font-family="system-ui" font-size="10" font-weight="bold" fill="#065f46">Expressão Honest:</text>
      <text x="22" y="322" font-family="system-ui" font-size="9" fill="#047857">• Confirmação serena</text>
      <text x="22" y="340" font-family="system-ui" font-size="9" fill="#047857">• Dados entregues a salvo</text>
      <text x="22" y="358" font-family="system-ui" font-size="9" fill="#047857">• Celebração do alívio</text>
    </g>

    <!-- 4. ERROR -->
    <g transform="translate(675, 60)">
      <rect width="195" height="400" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <rect width="195" height="34" rx="8" fill="#fef2f2"/>
      <circle cx="16" cy="17" r="4" fill="#ef4444"/>
      <text x="28" y="21" font-family="system-ui" font-weight="bold" font-size="11" fill="#991b1b">4. ESTADO: ERROR</text>

      <g transform="translate(16, 50)" text-anchor="middle">
        <circle cx="81" cy="40" r="28" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
        <text x="81" y="48" font-family="system-ui" font-size="28">🌧️</text>
        <text x="81" y="96" font-family="system-ui" font-weight="700" font-size="13" fill="#b91c1c">Dificuldade Temporária</text>
        <text x="81" y="118" font-family="system-ui" font-size="10" fill="#991b1b">A rede oscilou, mas seus</text>
        <text x="81" y="132" font-family="system-ui" font-size="10" fill="#991b1b">dados continuam seguros.</text>
      </g>

      <rect x="20" y="210" width="155" height="36" rx="6" fill="#ea580c"/>
      <text x="97" y="232" font-family="system-ui" font-weight="bold" font-size="11" fill="#fff" text-anchor="middle">Tentar Novamente</text>

      <rect x="14" y="280" width="167" height="100" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="22" y="302" font-family="system-ui" font-size="10" font-weight="bold" fill="#991b1b">Expressão Honest:</text>
      <text x="22" y="322" font-family="system-ui" font-size="9" fill="#991b1b">• Vulnerabilidade assumida</text>
      <text x="22" y="340" font-family="system-ui" font-size="9" fill="#991b1b">• Sem culpar o usuário</text>
      <text x="22" y="358" font-family="system-ui" font-size="9" fill="#991b1b">• Botão claro de reenvio</text>
    </g>
  </g>

</svg>