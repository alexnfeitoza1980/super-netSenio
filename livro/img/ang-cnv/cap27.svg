<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d96b27" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140803"/>
      <stop offset="60%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#180a04"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
  </defs>

  <!-- Fundo de Studio da Ilustração -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid tático refinado -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/><line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Halo de luz quente -->
  <circle cx="480" cy="270" r="320" fill="#f59e0b" opacity="0.06" filter="blur(60px)"/>

  
  <!-- Visualizador de Acessibilidade com Leitor de Tela e FocusTrap -->
  <g transform="translate(40, 30)" filter="url(#winShadow)">
    <rect width="880" height="480" rx="10" fill="#0f172a"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="310" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="440" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Acessibilidade Universal — Angular CDK LiveAnnouncer &amp; FocusTrap</text>
    

    <!-- Diálogo Modal Central com FocusTrap ativo -->
    <g transform="translate(200, 60)">
      <rect width="480" height="280" rx="14" fill="#ffffff" filter="url(#winShadow)" stroke="#d96b27" stroke-width="2"/>
      
      <!-- Indicador Visual do FocusTrap -->
      <rect x="0" y="0" width="480" height="34" rx="14" fill="#fdf4eb"/>
      <circle cx="20" cy="17" r="5" fill="#d96b27"/>
      <text x="34" y="21" font-family="system-ui" font-weight="bold" font-size="11" fill="#2a1508">cdkTrapFocus ATIVO — Diálogo Inclusivo</text>

      <g transform="translate(30, 60)">
        <text y="16" font-family="system-ui" font-weight="bold" font-size="15" fill="#0f172a">Confirmar Acolhimento Compassivo?</text>
        <text y="42" font-family="system-ui" font-size="11" fill="#475569">Esta mensagem será enviada sem acusações ou exigências.</text>
        <text y="60" font-family="system-ui" font-size="11" fill="#475569">O foco do teclado circulará com segurança dentro desta janela.</text>

        <!-- Botões com Anéis de Foco Acessíveis (:focus-visible) -->
        <g transform="translate(0, 110)">
          <!-- Botão 1 Focado (TAB) -->
          <rect width="180" height="42" rx="8" fill="#d96b27"/>
          <rect x="-4" y="-4" width="188" height="50" rx="12" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
          <text x="90" y="26" font-family="system-ui" font-weight="bold" font-size="11" fill="#fff" text-anchor="middle">Confirmar [Enter]</text>
          
          <!-- Botão 2 -->
          <rect x="200" width="180" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
          <text x="290" y="26" font-family="system-ui" font-weight="600" font-size="11" fill="#334155" text-anchor="middle">Cancelar [Esc]</text>
        </g>
      </g>
    </g>

    <!-- Balão de Áudio do Leitor de Tela (LiveAnnouncer / NVDA / VoiceOver) -->
    <g transform="translate(60, 360)">
      <rect width="760" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#winShadow)"/>
      <circle cx="40" cy="45" r="20" fill="#0284c7"/>
      <text x="40" y="52" font-family="system-ui" font-size="20" text-anchor="middle">📢</text>

      <g transform="translate(74, 28)">
        <text y="16" font-family="system-ui" font-weight="bold" font-size="12" fill="#38bdf8">Voz do Leitor de Tela (LiveAnnouncer • aria-live="polite"):</text>
        <text y="40" font-family="system-ui" font-size="13" fill="#f8fafc">
          "Diálogo de conciliação aberto. Botão Confirmar selecionado. Pressione Tab para navegar."
        </text>
      </g>
    </g>
  </g>

</svg>