<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d96b27" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140803"/>
      <stop offset="60%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#180a04"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
  </defs>

  <!-- Fundo de Studio da Ilustração -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid tático refinado -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/><line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Halo de luz quente -->
  <circle cx="480" cy="270" r="320" fill="#f59e0b" opacity="0.06" filter="blur(60px)"/>

  
  <!-- Terminal VS Code com Testes Unitários Passando &amp; Autocompaixão -->
  <g transform="translate(40, 30)" filter="url(#winShadow)">
    <rect width="880" height="480" rx="10" fill="#181825"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#11111b"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="310" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="440" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">VS Code Terminal — ng test --watch=false &amp; TypeScript Strict</text>
    

    <g transform="translate(30, 50)">
      <!-- Editor com Código Legado Sendo Refatorado -->
      <g transform="translate(0, 0)">
        <rect width="400" height="240" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
        <rect width="400" height="28" rx="8" fill="#181825"/>
        <text x="14" y="18" font-family="system-ui" font-size="11" fill="#cdd6f4">Refatoração Compassiva de Legado</text>

        <g transform="translate(16, 45)" font-family="monospace" font-size="10" fill="#cdd6f4">
          <text y="16" fill="#a6adc8">// Princípio da Autocompaixão Técnica:</text>
          <text y="36" fill="#f9e2af">// "O código antigo fez o melhor que podia com o</text>
          <text y="54" fill="#f9e2af">// prazo e as ferramentas que a equipe possuía."</text>
          <text y="80"><tspan fill="#f38ba8">- this.saldo = this.saldo + valor; // Mutação frágil</tspan></text>
          <text y="104"><tspan fill="#a6e3a1">+ this._saldo.update(s =&gt; s + valor); // Signal puro</tspan></text>
          <text y="134" fill="#89dceb">strictNullChecks: true</text>
          <text y="154" fill="#a6e3a1">✓ Proteção de tipos sem culpa nem vergonha</text>
        </g>
      </g>

      <!-- Painel de Redes de Proteção com TestBed -->
      <g transform="translate(420, 0)">
        <rect width="400" height="240" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
        <rect width="400" height="28" rx="8" fill="#181825"/>
        <text x="14" y="18" font-family="system-ui" font-size="11" fill="#a6e3a1">motor-cnv.service.spec.ts (TestBed)</text>

        <g transform="translate(16, 45)" font-family="monospace" font-size="10" fill="#cdd6f4">
          <text y="16"><tspan fill="#89dceb">it</tspan>(<tspan fill="#a6e3a1">'deve acolher erro sem quebrar'</tspan>, () =&gt; &#123;</text>
          <text y="36">  <tspan fill="#f9e2af">const</tspan> res = service.<tspan fill="#89dceb">traduzir</tspan>(textoTenso);</text>
          <text y="56">  <tspan fill="#89dceb">expect</tspan>(res.observacao).<tspan fill="#f9e2af">toBeDefined</tspan>();</text>
          <text y="76">  <tspan fill="#89dceb">expect</tspan>(res.nivelTensao).<tspan fill="#f9e2af">toBeGreaterThan</tspan>(<tspan fill="#fab387">5</tspan>);</text>
          <text y="96">&#125;);</text>
          <text y="130" fill="#89b4fa">Testes dão segurança psicológica para</text>
          <text y="148" fill="#89b4fa">refatorar sem medo paralisante.</text>
        </g>
      </g>

      <!-- Terminal do Sistema Operacional Rodando Testes -->
      <g transform="translate(0, 260)">
        <rect width="820" height="150" rx="8" fill="#11111b" stroke="#313244" stroke-width="1"/>
        <rect width="820" height="24" rx="8" fill="#181825"/>
        <text x="14" y="16" font-family="monospace" font-size="10" fill="#a6adc8">TERMINAL — bash</text>

        <g transform="translate(16, 42)" font-family="monospace" font-size="11">
          <text y="16" fill="#a6e3a1">$ ng test --watch=false</text>
          <text y="38" fill="#cdd6f4">✔ Browser application bundle generation complete.</text>
          <text y="58" fill="#10b981">✔ Karma connected on port 9876</text>
          <text y="78" fill="#a6e3a1">TOTAL: 15 SUCCESS (0.428 secs)</text>
          <text y="98" fill="#f9e2af">✨ Todas as suítes passaram. O código está protegido e pacificado.</text>
        </g>
      </g>
    </g>
  </g>

</svg>