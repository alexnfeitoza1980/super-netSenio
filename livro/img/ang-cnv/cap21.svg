<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d96b27" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140803"/>
      <stop offset="60%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#180a04"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#13141f"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
  </defs>

  <!-- Fundo de Studio da Ilustração -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid tático refinado -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="540"/><line x1="80" y1="0" x2="80" y2="540"/><line x1="160" y1="0" x2="160" y2="540"/><line x1="240" y1="0" x2="240" y2="540"/><line x1="320" y1="0" x2="320" y2="540"/><line x1="400" y1="0" x2="400" y2="540"/><line x1="480" y1="0" x2="480" y2="540"/><line x1="560" y1="0" x2="560" y2="540"/><line x1="640" y1="0" x2="640" y2="540"/><line x1="720" y1="0" x2="720" y2="540"/><line x1="800" y1="0" x2="800" y2="540"/><line x1="880" y1="0" x2="880" y2="540"/><line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/><line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/><line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/><line x1="0" y1="420" x2="960" y2="420"/><line x1="0" y1="480" x2="960" y2="480"/><line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Halo de luz quente -->
  <circle cx="480" cy="270" r="320" fill="#f59e0b" opacity="0.06" filter="blur(60px)"/>

  
  <!-- Comparativo Lado a Lado: Interface Violenta vs Interface Compassiva -->
  <!-- 1. Tela Hostil / Violenta -->
  <g transform="translate(35, 35)" filter="url(#winShadow)">
    <rect width="425" height="470" rx="10" fill="#ffffff"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 405 a 10,10 0 0 1 10,10 v 26 h -425 z" fill="#ef4444"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="82" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="212" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">ERRO — Sistema Inflexível v1.0</text>
    
    
    <rect x="0" y="36" width="425" height="434" fill="#fef2f2"/>
    
    <!-- Banner Agressivo -->
    <rect x="20" y="55" width="385" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="80" font-family="system-ui" font-size="18">⛔</text>
    <text x="64" y="80" font-family="system-ui" font-weight="bold" font-size="12" fill="#991b1b">ACESSO NEGADO: FORMULÁRIO INVÁLIDO!</text>
    <text x="64" y="98" font-family="system-ui" font-size="10" fill="#b91c1c">Você digitou dados inaceitáveis. O sistema não permite avançar.</text>

    <!-- Campo com Erro Violento -->
    <g transform="translate(20, 135)">
      <text y="14" font-family="system-ui" font-weight="bold" font-size="11" fill="#7f1d1d">Senha de Acesso *</text>
      <rect y="22" width="385" height="38" rx="6" fill="#fff" stroke="#ef4444" stroke-width="2"/>
      <text x="14" y="46" font-family="system-ui" font-size="12" fill="#ef4444">•••••</text>
      <text y="76" font-family="system-ui" font-size="10" font-weight="bold" fill="#b91c1c">✖ ERRO FATAL: Sua senha é fraca e inútil! Corrija agora!</text>
    </g>

    <!-- Prop Drilling Caótico Visualizado -->
    <g transform="translate(20, 245)">
      <rect width="385" height="190" rx="8" fill="#181825" stroke="#ef4444" stroke-width="1"/>
      <text x="14" y="24" font-family="system-ui" font-weight="bold" font-size="11" fill="#f38ba8">Prop Drilling Violento (Acoplamento Rígido)</text>
      
      <g transform="translate(14, 40)" font-family="monospace" font-size="10" fill="#a6adc8">
        <text y="16"><tspan fill="#f38ba8">&lt;AppComponent</tspan> [dados]="usuario"&gt;</text>
        <text y="38">  <tspan fill="#f38ba8">&lt;MainLayout</tspan> [dados]="dados"&gt;</text>
        <text y="60">    <tspan fill="#f38ba8">&lt;SidebarPanel</tspan> [dados]="dados"&gt;</text>
        <text y="82">      <tspan fill="#f38ba8">&lt;CardGroup</tspan> [dados]="dados"&gt;</text>
        <text y="104">        <tspan fill="#f38ba8">&lt;AvatarBadge</tspan> [dados]="dados" /&gt;</text>
        <text y="130" fill="#f38ba8">💥 4 componentes intermediários sobrecarregados</text>
      </g>
    </g>
  </g>

  <!-- 2. Tela Conectiva / Compassiva -->
  <g transform="translate(500, 35)" filter="url(#winShadow)">
    <rect width="425" height="470" rx="10" fill="#ffffff"/>
    
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 0,10 a 10,10 0 0 1 10,-10 h 405 a 10,10 0 0 1 10,10 v 26 h -425 z" fill="#10b981"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#27c93f"/>
    <rect x="82" y="8" width="260" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="212" y="22" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">app.compassivo.dev/registro</text>
    
    
    <rect x="0" y="36" width="425" height="434" fill="#fffaf5"/>

    <!-- Banner Acolhedor -->
    <rect x="20" y="55" width="385" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="36" y="80" font-family="system-ui" font-size="18">💡</text>
    <text x="64" y="80" font-family="system-ui" font-weight="bold" font-size="12" fill="#78350f">ORIENTAÇÃO CONTEXTUAL DE PROTEÇÃO</text>
    <text x="64" y="98" font-family="system-ui" font-size="10" fill="#92400e">Para proteger suas conversas, precisamos ajustar 1 requisito.</text>

    <!-- Campo com Orientação Empática -->
    <g transform="translate(20, 135)">
      <text y="14" font-family="system-ui" font-weight="600" font-size="11" fill="#2a1508">Sua chave secreta de proteção</text>
      <rect y="22" width="385" height="38" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
      <text x="14" y="46" font-family="system-ui" font-size="12" fill="#2a1508">•••••</text>
      <rect y="68" width="385" height="28" rx="4" fill="#fef9c3"/>
      <text x="12" y="86" font-family="system-ui" font-size="10" fill="#854d0e">🛡️ Identificamos 5 caracteres. Faltam 3 para garantir sua segurança.</text>
    </g>

    <!-- Injeção Limpa Desacoplada -->
    <g transform="translate(20, 245)">
      <rect width="385" height="190" rx="8" fill="#181825" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="24" font-family="system-ui" font-weight="bold" font-size="11" fill="#a6e3a1">Injeção Desacoplada (SessaoService + Signals)</text>
      
      <g transform="translate(14, 40)" font-family="monospace" font-size="10" fill="#cdd6f4">
        <text y="16"><tspan fill="#cba6f7">export class</tspan> <tspan fill="#f9e2af">AvatarBadgeComponent</tspan> &#123;</text>
        <text y="38">  <tspan fill="#6c7086">// Injeção direta sem passar por intermediários</tspan></text>
        <text y="60">  <tspan fill="#89b4fa">protected</tspan> sessao = <tspan fill="#89dceb">inject</tspan>(<tspan fill="#f9e2af">SessaoService</tspan>);</text>
        <text y="82">  <tspan fill="#89b4fa">readonly</tspan> usuario = <tspan fill="#89b4fa">this</tspan>.sessao.<tspan fill="#89dceb">perfil</tspan>;</text>
        <text y="104">&#125;</text>
        <text y="130" fill="#a6e3a1">✓ Hierarquia livre de acoplamento e ruído</text>
      </g>
    </g>
  </g>

</svg>