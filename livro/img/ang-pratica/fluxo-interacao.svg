<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Fluxo de uma interação na Biblioteca Viva</title>
  <desc id="descricao">A pessoa informa uma busca, o componente atualiza o signal, uma propriedade computada filtra o catálogo e o template mostra os resultados.</desc>
  <defs><marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ee6c4d"/></marker></defs>
  <rect width="1000" height="420" rx="28" fill="#f6f9fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="36" y="125" width="190" height="132" rx="20" fill="#142536"/>
    <text x="131" y="174" fill="#fff" font-size="20" font-weight="700">Pessoa</text><text x="131" y="208" fill="#dbe7f2" font-size="15">digita “oceano”</text>
    <rect x="286" y="125" width="190" height="132" rx="20" fill="#3d5a80"/>
    <text x="381" y="174" fill="#fff" font-size="20" font-weight="700">Componente</text><text x="381" y="208" fill="#e6eef7" font-size="15">atualiza busca()</text>
    <rect x="536" y="125" width="190" height="132" rx="20" fill="#386641"/>
    <text x="631" y="174" fill="#fff" font-size="20" font-weight="700">computed()</text><text x="631" y="208" fill="#e5f1e4" font-size="15">calcula resultados</text>
    <rect x="786" y="125" width="178" height="132" rx="20" fill="#6d597a"/>
    <text x="875" y="174" fill="#fff" font-size="20" font-weight="700">Template</text><text x="875" y="208" fill="#f0e9f4" font-size="15">mostra os livros</text>
    <path d="M228 191h52m198 0h52m198 0h52" stroke="#ee6c4d" stroke-width="5" marker-end="url(#seta)"/>
    <path d="M875 282C875 360 131 360 131 282" fill="none" stroke="#ee6c4d" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#seta)"/>
    <text x="500" y="344" fill="#45596c" font-size="16">Um fluxo previsível: evento → estado → derivação → interface</text>
  </g>
</svg>
