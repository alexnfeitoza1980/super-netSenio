<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Ciclo de qualidade de uma feature Angular</title>
  <desc id="descricao">Entender a necessidade, desenhar a solução, implementar, testar com pessoas e aprender com o resultado.</desc>
  <defs><marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ee6c4d"/></marker></defs>
  <rect width="1000" height="390" rx="28" fill="#f6f9fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g fill="#142536">
      <rect x="75" y="110" width="190" height="118" rx="20"/><rect x="295" y="110" width="190" height="118" rx="20"/>
      <rect x="515" y="110" width="190" height="118" rx="20"/><rect x="735" y="110" width="190" height="118" rx="20"/>
    </g>
    <g fill="#fff" font-size="18" font-weight="700">
      <text x="170" y="158">Ouvir</text><text x="390" y="158">Projetar</text><text x="610" y="158">Construir</text><text x="830" y="158">Validar</text>
    </g>
    <g fill="#dbe7f2" font-size="14">
      <text x="170" y="190">qual é a necessidade?</text><text x="390" y="190">qual é o menor passo?</text>
      <text x="610" y="190">código legível e claro</text><text x="830" y="190">funciona para quem?</text>
    </g>
    <path d="M270 169h18m198 0h18m198 0h18" stroke="#ee6c4d" stroke-width="5" marker-end="url(#seta)"/>
    <path d="M830 246c-90 100-565 100-660 0" fill="none" stroke="#ee6c4d" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#seta)"/>
    <text x="500" y="338" fill="#45596c" font-size="16">Entrega pequena → feedback claro → próxima melhoria</text>
  </g>
</svg>
