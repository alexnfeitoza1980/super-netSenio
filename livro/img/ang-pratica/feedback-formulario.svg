<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Validação de formulário em três momentos</title>
  <desc id="descricao">A pessoa preenche um campo, recebe feedback claro associado ao campo e pode corrigir e enviar.</desc>
  <defs><marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ee6c4d"/></marker></defs>
  <rect width="1000" height="370" rx="28" fill="#f6f9fc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="55" y="90" width="250" height="170" rx="20" fill="#142536"/>
    <text x="180" y="142" fill="white" font-size="20" font-weight="700">1 · Preencher</text>
    <text x="180" y="180" fill="#dbe7f2" font-size="15">campo com label</text>
    <text x="180" y="207" fill="#dbe7f2" font-size="15">ajuda visível</text>
    <rect x="375" y="90" width="250" height="170" rx="20" fill="#bc6c25"/>
    <text x="500" y="142" fill="white" font-size="20" font-weight="700">2 · Validar</text>
    <text x="500" y="180" fill="#fff0df" font-size="15">erro específico</text>
    <text x="500" y="207" fill="#fff0df" font-size="15">ligado ao campo</text>
    <rect x="695" y="90" width="250" height="170" rx="20" fill="#386641"/>
    <text x="820" y="142" fill="white" font-size="20" font-weight="700">3 · Corrigir</text>
    <text x="820" y="180" fill="#e5f1e4" font-size="15">valor preservado</text>
    <text x="820" y="207" fill="#e5f1e4" font-size="15">sucesso anunciado</text>
    <path d="M311 175h52m268 0h52" stroke="#ee6c4d" stroke-width="5" marker-end="url(#seta)"/>
    <text x="500" y="320" fill="#45596c" font-size="16">Orientação clara sem atribuir culpa à pessoa</text>
  </g>
</svg>
