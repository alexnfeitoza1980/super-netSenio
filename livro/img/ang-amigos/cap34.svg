<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">VS Code — IntelliSense Hover &amp; TSDoc Rich Preview</text>
    
      
      <g transform="translate(40, 66)">
        <rect width="880" height="444" fill="#1e1e1e"/>
        
        <!-- Código de Fundo -->
        <g font-family="Consolas, monospace" font-size="12" fill="#d4d4d4">
          <text x="30" y="40"><tspan fill="#c586c0">import</tspan> { Component } <tspan fill="#c586c0">from</tspan> <tspan fill="#ce9178">'@angular/core'</tspan>;</text>
          <text x="30" y="70"><tspan fill="#c586c0">import</tspan> { AmgSelectComponent } <tspan fill="#c586c0">from</tspan> <tspan fill="#ce9178">'@amigos/ui'</tspan>;</text>
          <text x="30" y="110"><tspan fill="#dcdcaa">@Component</tspan>({</text>
          <text x="50" y="140">imports: [<tspan fill="#4ec9b0">AmgSelectComponent</tspan>],</text>
          <text x="50" y="170">template: <tspan fill="#ce9178">`</tspan></text>
          <text x="70" y="200">&lt;<tspan fill="#4ec9b0">amg-select</tspan></text>
          <text x="90" y="230"><tspan fill="#9cdcfe">placeholder</tspan>=<tspan fill="#ce9178">"Escolha um colega"</tspan></text>
          <text x="90" y="260"><tspan fill="#9cdcfe">searchable</tspan></text>
          <text x="70" y="290">&gt;&lt;/<tspan fill="#4ec9b0">amg-select</tspan>&gt;</text>
        </g>
        
        <!-- Pop-up Rico de Hover do VS Code (TSDoc com exemplos) -->
        <g transform="translate(240, 150)" filter="url(#winShadow)">
          <rect width="580" height="250" rx="6" fill="#252526" stroke="#454545" stroke-width="1"/>
          <rect width="580" height="32" rx="6" fill="#2d2d2d"/>
          <text x="16" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">AmgSelectComponent&lt;T&gt; (Componente Standalone com Suporte a CDK)</text>
          
          <g transform="translate(16, 45)" font-family="Consolas, monospace" font-size="11">
            <text x="0" y="16" fill="#9cdcfe">(property) <tspan fill="#dcdcaa">searchable</tspan>: InputSignal&lt;<tspan fill="#4ec9b0">boolean</tspan>&gt;</text>
            <text x="0" y="38" font-family="system-ui, sans-serif" fill="#d4d4d4">Habilita campo de busca com debounce reativo de 250ms e live announcements ARIA.</text>
            
            <rect x="0" y="55" width="548" height="90" rx="4" fill="#1e1e1e" stroke="#333333"/>
            <text x="12" y="75" fill="#6a9955">/// Exemplo de uso com Signals:</text>
            <text x="12" y="95" fill="#9cdcfe">&lt;<tspan fill="#4ec9b0">amg-select</tspan> [<tspan fill="#9cdcfe">options</tspan>]=<tspan fill="#ce9178">"equipes()"</tspan> [<tspan fill="#9cdcfe">searchable</tspan>]=<tspan fill="#ce9178">"true"</tspan></text>
            <text x="12" y="115" fill="#9cdcfe">            [(<tspan fill="#9cdcfe">value</tspan>)]=<tspan fill="#ce9178">"equipeSelecionada"</tspan> /&gt;</text>
            
            <text x="0" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">★ Dale Carnegie Insight: "O desenvolvedor ama APIs que antecipam suas dúvidas."</text>
            <text x="0" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">@param options - Coleção reativa tipada de itens a serem exibidos no dropdown.</text>
          </g>
        </g>
      </g>
    </g>
    
</svg>