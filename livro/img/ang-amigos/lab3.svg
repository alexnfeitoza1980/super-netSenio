<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Amigos UI Showcase — Design System Executável com Angular 19 e CDK</text>
    
      
      <!-- Topo do Showcase -->
      <g transform="translate(40, 66)">
        <rect width="880" height="50" fill="#1e293b"/>
        <text x="30" y="31" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">🤝 Laboratório 3 · Showcase Interativo Amigos UI</text>
        
        <rect x="730" y="12" width="120" height="26" rx="13" fill="#2563eb"/>
        <text x="790" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Executar Código</text>
      </g>
      
      <!-- Grid de Componentes do Lab -->
      <g transform="translate(60, 136)">
        <!-- Coluna 1: AmgButton e AmgDialog -->
        <g transform="translate(0, 0)">
          <rect width="250" height="160" rx="8" fill="#1e293b" stroke="#3b82f6"/>
          <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">BOTAO &amp; DIALOG ACESSIVEL</text>
          <g transform="translate(15, 45)">
            <rect width="100" height="32" rx="4" fill="#2563eb"/>
            <text x="50" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Elogiar</text>
            <rect x="110" width="100" height="32" rx="4" fill="#334155"/>
            <text x="160" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Dispensar</text>
            <text x="0" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Suporte a variantes, estado loading e FocusTrap do CDK.</text>
          </g>
        </g>
        
        <!-- Coluna 2: AmgSelect com CVA -->
        <g transform="translate(275, 0)">
          <rect width="260" height="160" rx="8" fill="#1e293b" stroke="#f59e0b"/>
          <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">SELECT COM BUSCA E CVA</text>
          <g transform="translate(15, 45)">
            <rect width="230" height="32" rx="4" fill="#0f172a" stroke="#475569"/>
            <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">Procurar amigo... 🔍</text>
            <text x="0" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Integrado com Reactive Forms e leitor de tela LiveAnnouncer.</text>
          </g>
        </g>
        
        <!-- Coluna 3: Virtual Scroll &amp; Drag -->
        <g transform="translate(560, 0)">
          <rect width="240" height="160" rx="8" fill="#1e293b" stroke="#10b981"/>
          <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399">CDK VIRTUAL SCROLL</text>
          <g transform="translate(15, 45)">
            <rect width="210" height="24" rx="4" fill="#0f172a"/>
            <text x="10" y="16" font-family="Consolas, monospace" font-size="10" fill="#4ade80">● 10.000 cards a 60fps</text>
            <rect y="32" width="210" height="24" rx="4" fill="#0f172a"/>
            <text x="10" y="48" font-family="Consolas, monospace" font-size="10" fill="#38bdf8">● Drag &amp; Drop reativo</text>
            <text x="0" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Zero travamento de thread principal.</text>
          </g>
        </g>
        
        <!-- Banner de Sucesso dos Testes do Lab -->
        <g transform="translate(0, 180)">
          <rect width="800" height="150" rx="8" fill="#020617" stroke="#334155"/>
          <rect width="800" height="30" rx="8" fill="#1e293b"/>
          <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">TESTES AUTOMATIZADOS DO DESIGN SYSTEM (VITEST + CDK HARNESSES)</text>
          
          <g transform="translate(15, 45)" font-family="Consolas, monospace" font-size="11">
            <text x="0" y="18" fill="#4ade80">PASS  src/app/amg-button.harness.spec.ts (6 testes concluídos)</text>
            <text x="0" y="38" fill="#4ade80">PASS  src/app/amg-dialog.harness.spec.ts (8 testes concluídos)</text>
            <text x="0" y="58" fill="#4ade80">PASS  src/app/amg-select.harness.spec.ts (12 testes concluídos)</text>
            <text x="0" y="78" fill="#4ade80">PASS  src/app/amg-scroll.harness.spec.ts (5 testes concluídos)</text>
            <text x="0" y="100" fill="#fbbf24">Test Suites: 4 passed, 4 total | Tests: 31 passed, 31 total (100% de cobertura)</text>
          </g>
        </g>
      </g>
    </g>
    
</svg>