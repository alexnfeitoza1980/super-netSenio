<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Terminal — Angular CLI ng update &amp; Schematics Migration</text>
    
      
      <g transform="translate(60, 80)">
        <rect width="800" height="390" rx="8" fill="#0d1117" stroke="#30363d"/>
        <text x="20" y="35" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">$ ng update @amigos/ui --from=1.0.0 --to=2.0.0</text>
        
        <g transform="translate(20, 65)" font-family="Consolas, monospace" font-size="11">
          <text x="0" y="20" fill="#e6edf3">Iniciando migração suave da biblioteca Amigos UI...</text>
          <text x="0" y="45" fill="#4ade80">UPDATE package.json (versão atualizada para ^2.0.0)</text>
          <text x="0" y="70" fill="#4ade80">UPDATE src/app/dashboard.component.ts (substituindo @Input por input())</text>
          <text x="0" y="95" fill="#4ade80">UPDATE src/app/chat.component.html (migrando *ngIf para @if reativo)</text>
          <text x="0" y="120" fill="#4ade80">UPDATE src/app/perfil.component.ts (ajustando imports deprecados sem quebra)</text>
          
          <rect x="0" y="145" width="760" height="50" rx="6" fill="#161b22" stroke="#238636"/>
          <text x="15" y="168" fill="#3fb950" font-weight="bold">✔ Migração concluída com 100% de sucesso. Zero intervenções manuais necessárias!</text>
          <text x="15" y="186" fill="#8b949e">Foram transformados 18 arquivos em 340ms.</text>
        </g>
        
        <!-- Bloco de Sabedoria de Dale Carnegie -->
        <g transform="translate(20, 280)">
          <rect width="760" height="85" rx="6" fill="#161b22" stroke="#30363d"/>
          <text x="15" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">DALE CARNEGIE · CAPÍTULO 11: "RESPEITE A OPINIÃO ALHEIA. NUNCA DIGA 'VOCÊ ESTÁ ERRADO'"</text>
          <text x="15" y="47" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Autores de bibliotecas imaturas quebram contratos entre versões menores e culpam o consumidor por "não ler o changelog".</text>
          <text x="15" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">Autores amigos fornecem Schematics automáticos: o próprio CLI atualiza o código do usuário com carinho e respeito.</text>
        </g>
      </g>
    </g>
    
</svg>