<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Terminal — Build Profissional com ng-packagr e FESM2022</text>
    
      
      <g transform="translate(60, 80)">
        <rect width="800" height="390" rx="8" fill="#0d1117" stroke="#30363d"/>
        <text x="20" y="30" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">$ ng build @amigos/ui --configuration production</text>
        
        <g transform="translate(20, 60)" font-family="Consolas, monospace" font-size="11">
          <text x="0" y="15" fill="#e6edf3">Compilando biblioteca com ng-packagr v19.0.0...</text>
          <text x="0" y="35" fill="#4ade80">✔ Gerando compilação FESM2022 (ES Modules puros para Tree-Shaking)</text>
          <text x="0" y="55" fill="#4ade80">✔ Extraindo definições de tipos TypeScript (.d.ts) com documentação TSDoc</text>
          <text x="0" y="75" fill="#4ade80">✔ Processando estilos CSS nativos com Custom Properties</text>
          <text x="0" y="95" fill="#4ade80">✔ Gerando exports secundários (@amigos/ui/cdk, @amigos/ui/testing)</text>
          
          <!-- Tabela de Tamanhos -->
          <rect x="0" y="115" width="760" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
          <text x="15" y="140" fill="#58a6ff" font-weight="bold">PACOTE DISTRIBUÍVEL (dist/amigos/ui):</text>
          <text x="15" y="165" fill="#8b949e">● fesm2022/amigos-ui.mjs ................. 24.2 kB (Gzip: 6.8 kB)</text>
          <text x="15" y="185" fill="#8b949e">● index.d.ts ............................. 12.1 kB (100% tipado com Generics)</text>
          <text x="15" y="205" fill="#3fb950">✔ Tree-shake audit: 100% de dead code eliminado quando não consumido.</text>
        </g>
        
        <!-- Rodapé Dale Carnegie -->
        <g transform="translate(20, 290)">
          <rect width="760" height="75" rx="6" fill="#161b22" stroke="#30363d"/>
          <text x="15" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">DALE CARNEGIE · CAPÍTULO 19: "DÊ AO OUTRO UMA REPUTAÇÃO A ZELAR"</text>
          <text x="15" y="47" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Distribuir uma biblioteca profissional significa respeitar o bundle final de quem a instala.</text>
          <text x="15" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">Com FESM2022 e sideEffects: false, o desenvolvedor consome apenas o que precisa, com leveza e orgulho.</text>
        </g>
      </g>
    </g>
    
</svg>