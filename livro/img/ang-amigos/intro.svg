<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">amigos.angular.dev — Hub do Desenvolvedor Amigável</text>
    
      
      <!-- Header do App -->
      <rect x="40" y="66" width="880" height="50" fill="#1e293b"/>
      <circle cx="75" cy="91" r="14" fill="#2563eb"/>
      <text x="75" y="96" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">🤝</text>
      <text x="100" y="96" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Amigos UI</text>
      <text x="180" y="96" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">· Dale Carnegie na Arquitetura Angular 19</text>
      
      <rect x="760" y="78" width="140" height="26" rx="13" fill="#2563eb"/>
      <text x="830" y="95" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">npm i @amigos/ui</text>
      
      <!-- Conteúdo do Hub -->
      <!-- Card 1: Técnicas Fundamentais -->
      <g transform="translate(60, 136)">
        <rect width="250" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">PARTE I · FUNDAMENTOS</text>
        <text x="16" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">APIs Empáticas &amp; DX</text>
        <line x1="16" y1="60" x2="234" y2="60" stroke="#334155"/>
        <text x="16" y="80" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ assertDevMode()</text>
        <text x="16" y="100" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ TSDoc &amp; Autocomplete</text>
        <text x="16" y="120" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ Consumer-Driven Design</text>
      </g>
      
      <!-- Card 2: 6 Maneiras de Fazer Amar -->
      <g transform="translate(350, 136)">
        <rect width="250" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">PARTE II · ADOÇÃO TOTAL</text>
        <text x="16" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Ergonomia e Flexibilidade</text>
        <line x1="16" y1="60" x2="234" y2="60" stroke="#334155"/>
        <text x="16" y="80" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ ng-content multi-slot</text>
        <text x="16" y="100" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ Angular CDK A11y &amp; Overlay</text>
        <text x="16" y="120" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ ControlValueAccessor</text>
      </g>
      
      <!-- Card 3: Conquistando a Equipe -->
      <g transform="translate(640, 136)">
        <rect width="250" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">PARTE III · SEM CONFLITOS</text>
        <text x="16" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Reatividade e Resiliência</text>
        <line x1="16" y1="60" x2="234" y2="60" stroke="#334155"/>
        <text x="16" y="80" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ Signals Unidirecionais</text>
        <text x="16" y="100" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ Schematics (ng update)</text>
        <text x="16" y="120" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">✔ Component Harnesses</text>
      </g>
      
      <!-- Banner Inferior: Showcase do Lab -->
      <g transform="translate(60, 310)">
        <rect width="830" height="175" rx="8" fill="#020617" stroke="#1e293b"/>
        <rect x="0" y="0" width="830" height="32" rx="8" fill="#1e293b"/>
        <text x="16" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">SHOWCASE: DESIGN SYSTEM INTERATIVO COM ANGULAR 19</text>
        
        <!-- Demonstração de Componentes -->
        <g transform="translate(20, 50)">
          <!-- Botão Amigável -->
          <rect width="110" height="36" rx="6" fill="#2563eb"/>
          <text x="55" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Salvar com Empatia</text>
          
          <!-- Dropdown Acessível -->
          <g transform="translate(130, 0)">
            <rect width="180" height="36" rx="6" fill="#1e293b" stroke="#475569"/>
            <text x="14" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Selecionar Equipe...</text>
            <path d="M 155,15 l 5,5 l 5,-5" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
          </g>
          
          <!-- Badge A11y -->
          <g transform="translate(330, 6)">
            <rect width="90" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
            <text x="45" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">ARIA 100%</text>
          </g>
          
          <!-- Signals Flow Indicator -->
          <g transform="translate(440, 6)">
            <rect width="140" height="24" rx="12" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6"/>
            <text x="70" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#60a5fa" text-anchor="middle">Signals Reactive Flow</text>
          </g>
          
          <!-- CDK Overlay Pill -->
          <g transform="translate(600, 6)">
            <rect width="120" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b"/>
            <text x="60" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle">CDK Connected Overlay</text>
          </g>
        </g>
        
        <!-- Terminal de Status na Base -->
        <g transform="translate(20, 105)">
          <rect width="790" height="55" rx="4" fill="#090d16"/>
          <text x="14" y="22" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">$ ng test --include="**/*.harness.spec.ts"</text>
          <text x="14" y="42" font-family="Consolas, monospace" font-size="11" fill="#4ade80">✔ Executados 42 testes via CDK Component Harnesses com sucesso em 1.14s (0 erros de tipagem)</text>
        </g>
      </g>
    </g>
    
</svg>