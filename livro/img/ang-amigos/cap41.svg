<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Browser — CDK Overlay flutuante e Variáveis CSS de Tema</text>
    
      
      <g transform="translate(60, 80)">
        <!-- Painel Principal de Aplicação -->
        <rect width="800" height="390" rx="8" fill="#1e293b" stroke="#334155"/>
        
        <!-- Topo da Aplicação com Seletor de Cores -->
        <g transform="translate(30, 25)">
          <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Painel de Relacionamento Amigável</text>
          
          <!-- Botões de Troca de Tema -->
          <g transform="translate(480, 0)">
            <rect width="80" height="26" rx="4" fill="#2563eb"/>
            <text x="40" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Azul Confiança</text>
            
            <rect x="90" width="80" height="26" rx="4" fill="#d97706"/>
            <text x="130" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Âmbar Calor</text>
            
            <rect x="180" width="80" height="26" rx="4" fill="#059669"/>
            <text x="220" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Verde Harmonia</text>
          </g>
        </g>
        
        <!-- Conteúdo com Botão Gatilho -->
        <g transform="translate(30, 90)">
          <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Clique para abrir o painel ancorado renderizado fora do fluxo DOM:</text>
          
          <rect y="40" width="180" height="38" rx="6" fill="#2563eb" id="triggerBtn"/>
          <text x="90" y="64" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Opções Avançadas ▼</text>
        </g>
        
        <!-- O CDK Overlay Flutuante (renderizado no body, ancorado ao botão) -->
        <g transform="translate(30, 180)" filter="url(#winShadow)">
          <rect width="280" height="170" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
          <rect width="280" height="28" rx="8" fill="#1e293b"/>
          <text x="15" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa">cdk-overlay-pane [z-index: 1000]</text>
          
          <g transform="translate(15, 45)" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">
            <text x="0" y="15">✨ Enviar Elogio em Público</text>
            <text x="0" y="40">💌 Feedback Particular e Gentil</text>
            <text x="0" y="65">🤝 Delegar Responsabilidade</text>
            <line x1="0" y1="80" x2="250" y2="80" stroke="#334155"/>
            <text x="0" y="105" fill="#f87171">🚪 Cancelar Conexão</text>
          </g>
        </g>
        
        <!-- Explicação Técnica à Direita -->
        <g transform="translate(350, 100)">
          <rect width="420" height="250" rx="8" fill="#020617" stroke="#1e293b"/>
          <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">VANTAGENS DO ANGULAR CDK OVERLAY:</text>
          
          <g transform="translate(20, 50)" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
            <text x="0" y="20">1. <tspan fill="#ffffff" font-weight="bold">Zero conflito de z-index:</tspan> o overlay é montado no final do body.</text>
            <text x="0" y="45">2. <tspan fill="#ffffff" font-weight="bold">Posicionamento inteligente:</tspan> se não couber abaixo, pula para cima.</text>
            <text x="0" y="70">3. <tspan fill="#ffffff" font-weight="bold">Theming desacoplado:</tspan> herda variáveis CSS via seletor :root.</text>
            <text x="0" y="95">4. <tspan fill="#ffffff" font-weight="bold">Fechamento automático:</tspan> backdropClick() e ESC fecham com suavidade.</text>
          </g>
          
          <rect x="20" y="170" width="380" height="60" rx="4" fill="#1e293b"/>
          <text x="35" y="195" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">DALE CARNEGIE · CAPÍTULO 6:</text>
          <text x="35" y="213" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">"Faça a outra pessoa sentir-se importante sem aprisioná-la."</text>
        </g>
      </g>
    </g>
    
</svg>