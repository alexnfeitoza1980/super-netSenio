<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Angular DevTools — Grafo Reativo Unidirecional de Signals</text>
    
      
      <g transform="translate(60, 80)">
        <rect width="800" height="390" rx="8" fill="#0f172a" stroke="#334155"/>
        
        <!-- Visualização do Grafo de Signals -->
        <g transform="translate(40, 40)">
          <!-- Signal Raiz: amigos = signal([]) -->
          <rect width="180" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
          <text x="15" y="25" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#60a5fa">signal: amigos</text>
          <text x="15" y="45" font-family="Consolas, monospace" font-size="10" fill="#94a3b8">tipo: WritableSignal</text>
          <text x="15" y="65" font-family="Consolas, monospace" font-size="10" fill="#4ade80">valor: 4 conexões</text>
          
          <!-- Seta para Computed 1 -->
          <line x1="180" y1="80" x2="280" y2="60" stroke="#3b82f6" stroke-width="2"/>
          <!-- Seta para Computed 2 -->
          <line x1="180" y1="80" x2="280" y2="170" stroke="#3b82f6" stroke-width="2"/>
          
          <!-- Computed 1: totalElogios = computed() -->
          <g transform="translate(280, 20)">
            <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
            <text x="15" y="25" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#fbbf24">computed: totalElogios</text>
            <text x="15" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Derivado puro sem efeitos colaterais</text>
            <text x="15" y="65" font-family="Consolas, monospace" font-size="10" fill="#38bdf8">Retorna: 18 elogios ativos</text>
          </g>
          
          <!-- Computed 2: amigosFiltrados = computed() -->
          <g transform="translate(280, 130)">
            <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
            <text x="15" y="25" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#fbbf24">computed: amigosFiltrados</text>
            <text x="15" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Filtra por termo de busca</text>
            <text x="15" y="65" font-family="Consolas, monospace" font-size="10" fill="#38bdf8">Memoizado (Cache Inteligente)</text>
          </g>
          
          <!-- Seta para Template / DOM -->
          <line x1="500" y1="100" x2="580" y2="100" stroke="#10b981" stroke-width="2"/>
          
          <!-- Nó Final: Template View -->
          <g transform="translate(580, 50)">
            <rect width="180" height="110" rx="8" fill="#020617" stroke="#10b981" stroke-width="2"/>
            <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399">UI TEMPLATE</text>
            <text x="15" y="48" font-family="Consolas, monospace" font-size="10" fill="#e2e8f0">@for (a of amigos())</text>
            <text x="15" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#4ade80">● 0 Ciclos Duplos</text>
            <text x="15" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#4ade80">● 0 ExpressionChanged</text>
          </g>
        </g>
        
        <!-- Banner Explicativo -->
        <g transform="translate(40, 260)">
          <rect width="720" height="95" rx="6" fill="#1e293b" stroke="#334155"/>
          <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">DALE CARNEGIE · CAPÍTULO 10: "A ÚNICA FORMA DE GANHAR UMA DISCUSSÃO É EVITANDO-A"</text>
          <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">No Angular tradicional, mutações bidirecionais imprevisíveis criam "discussões" entre o template e o modelo (ExpressionChangedAfterItHasBeenCheckedError).</text>
          <text x="20" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Com Signals, o fluxo é estritamente unidirecional, previsível e imutável. Não há discussão: há clareza e paz.</text>
        </g>
      </g>
    </g>
    
</svg>