<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">VS Code — Testes Desacoplados com Component Harnesses</text>
    
      
      <g transform="translate(60, 80)">
        <rect width="800" height="390" rx="8" fill="#1e1e1e" stroke="#333333"/>
        
        <!-- Código do Teste Unitário -->
        <g transform="translate(20, 25)" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">
          <text x="0" y="15" fill="#6a9955">// Teste elegante: zero querySelector('.btn-blue-v2')!</text>
          <text x="0" y="35"><tspan fill="#569cd6">it</tspan>(<tspan fill="#ce9178">'deve abrir o modal de elogio e emitir confirmação'</tspan>, <tspan fill="#569cd6">async</tspan> () =&gt; {</text>
          
          <text x="15" y="60"><tspan fill="#569cd6">const</tspan> loader = <tspan fill="#4ec9b0">TestbedHarnessEnvironment</tspan>.loader(fixture);</text>
          <text x="15" y="85"><tspan fill="#569cd6">const</tspan> dialog = <tspan fill="#569cd6">await</tspan> loader.getHarness(<tspan fill="#4ec9b0">AmgDialogHarness</tspan>);</text>
          <text x="15" y="110"><tspan fill="#569cd6">const</tspan> button = <tspan fill="#569cd6">await</tspan> dialog.getButton({ text: <tspan fill="#ce9178">'Confirmar'</tspan> });</text>
          
          <text x="15" y="140"><tspan fill="#569cd6">await</tspan> button.click();</text>
          
          <text x="15" y="170"><tspan fill="#4ec9b0">expect</tspan>(<tspan fill="#569cd6">await</tspan> dialog.isOpen()).toBe(<tspan fill="#569cd6">false</tspan>);</text>
          <text x="15" y="195"><tspan fill="#4ec9b0">expect</tspan>(component.elogioEnviado()).toBe(<tspan fill="#569cd6">true</tspan>);</text>
          <text x="0" y="220">})</text>
        </g>
        
        <!-- Terminal Inferior com Sucesso -->
        <g transform="translate(20, 260)">
          <rect width="760" height="105" rx="6" fill="#0d1117" stroke="#30363d"/>
          <text x="15" y="24" font-family="Consolas, monospace" font-size="11" fill="#4ade80">✔ Chrome Headless 122.0: Executados 38 specs em 0.92s (0 failures)</text>
          <text x="15" y="44" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">✔ AmgDialogHarness cobriu FocusTrap, ARIA e eventos sem acoplar a classes CSS.</text>
          
          <line x1="15" y1="58" x2="745" y2="58" stroke="#21262d"/>
          
          <text x="15" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">DALE CARNEGIE · CAPÍTULO 16: "DEIXE A OUTRA PESSOA SENTIR QUE A IDEIA É DELA"</text>
          <text x="15" y="94" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">Fornecer Harnesses oficiais para seus componentes permite que outros times testem a UI com a semântica deles, sem quebrar quando você refatorar classes internas.</text>
        </g>
      </g>
    </g>
    
</svg>