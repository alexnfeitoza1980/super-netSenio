<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Arquitetura — Hierarquia de Injeção de Dependências Opcional</text>
    
      
      <g transform="translate(60, 80)">
        <rect width="800" height="390" rx="8" fill="#1e293b" stroke="#334155"/>
        
        <!-- Árvore de DI -->
        <g transform="translate(40, 30)">
          <!-- Nível 1: Root Provider com Defaults -->
          <rect width="720" height="70" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="20" y="25" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#60a5fa">ROOT INJECTOR (app.config.ts)</text>
          <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">provideAmigosUI({ theme: 'corporate', toastDuration: 3000 })</text>
          
          <line x1="360" y1="70" x2="360" y2="105" stroke="#3b82f6" stroke-width="2"/>
          
          <!-- Nível 2: Feature Scope Override -->
          <g transform="translate(60, 105)">
            <rect width="600" height="70" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
            <text x="20" y="25" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#fbbf24">FEATURE COMPONENT PROVIDER (Opcional)</text>
            <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Sobrescreve apenas para a área de Atendimento sem afetar o restante do app.</text>
          </g>
          
          <line x1="360" y1="175" x2="360" y2="210" stroke="#f59e0b" stroke-width="2"/>
          
          <!-- Nível 3: Injeção Segura e Flexível no Componente -->
          <g transform="translate(120, 210)">
            <rect width="480" height="70" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
            <text x="20" y="25" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#34d399">INJEÇÃO NÃO-PUNITIVA:</text>
            <text x="20" y="48" font-family="Consolas, monospace" font-size="11" fill="#4ade80">private config = inject(AMG_CONFIG, { optional: true }) ?? DEFAULT;</text>
          </g>
        </g>
        
        <!-- Rodapé Dale Carnegie -->
        <g transform="translate(40, 315)">
          <rect width="720" height="55" rx="6" fill="#020617"/>
          <text x="20" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">DALE CARNEGIE · CAPÍTULO 18: "FALE PRIMEIRO SOBRE SEUS PRÓPRIOS ERROS"</text>
          <text x="20" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Uma biblioteca humilde não explode com NullInjectorError se o dev esquecer um provider. Ela assume defaults seguros.</text>
        </g>
      </g>
    </g>
    
</svg>