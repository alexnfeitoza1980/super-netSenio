<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Terminal &amp; Browser — 0 to 60 FPS em 1 Comando</text>
    
      
      <g transform="translate(60, 80)">
        <!-- Terminal de Instalação -->
        <rect width="800" height="170" rx="8" fill="#020617" stroke="#1e293b"/>
        <text x="20" y="28" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">$ ng add @amigos/ui</text>
        <text x="20" y="55" font-family="Consolas, monospace" font-size="11" fill="#4ade80">✔ Pacote @amigos/ui baixado e verificado com sucesso.</text>
        <text x="20" y="75" font-family="Consolas, monospace" font-size="11" fill="#4ade80">✔ Fontes do sistema e variáveis CSS injetadas em styles.css.</text>
        <text x="20" y="95" font-family="Consolas, monospace" font-size="11" fill="#4ade80">✔ Zero providers obrigatórios no app.config.ts (Standalone First).</text>
        <text x="20" y="125" font-family="Consolas, monospace" font-size="11" fill="#fbbf24">🚀 Pronto para usar: importe o componente direto no seu template!</text>
        
        <!-- Demonstração Visual do Componente Funcionando Instantaneamente -->
        <g transform="translate(0, 195)">
          <rect width="800" height="195" rx="8" fill="#1e293b" stroke="#334155"/>
          <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">RESULTADO IMEDIATO NO BROWSER (SEM BOILERPLATE)</text>
          
          <g transform="translate(30, 50)">
            <!-- Card de boas-vindas do Amigos UI -->
            <rect width="450" height="115" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
            <circle cx="45" cy="45" r="20" fill="#2563eb"/>
            <text x="45" y="52" font-family="system-ui, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">😊</text>
            <text x="80" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Seja Bem-vindo ao Amigos UI</text>
            <text x="80" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Componentes acessíveis, responsivos e zero atrito.</text>
            <rect x="80" y="75" width="100" height="26" rx="4" fill="#2563eb"/>
            <text x="130" y="92" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Experimentar</text>
          </g>
          
          <!-- Callout Dale Carnegie -->
          <g transform="translate(510, 50)">
            <rect width="260" height="115" rx="8" fill="#020617" stroke="#f59e0b"/>
            <text x="15" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">A PRIMEIRA IMPRESSÃO:</text>
            <text x="15" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">"Um sorriso não custa nada,</text>
            <text x="15" y="68" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">mas enriquece quem recebe.</text>
            <text x="15" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">Uma biblioteca de zero-config</text>
            <text x="15" y="104" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">conquista no primeiro minuto."</text>
          </g>
        </g>
      </g>
    </g>
    
</svg>