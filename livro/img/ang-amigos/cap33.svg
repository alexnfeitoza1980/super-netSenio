          <text x="15" y="25" fill="#6e7681">01</text>
          <text x="45" y="25"><tspan fill="#c586c0">import</tspan> { Component, input, assertDevMode } <tspan fill="#c586c0">from</tspan> <tspan fill="#ce9178">'@angular/core'</tspan>;</text>
          
          <text x="15" y="48" fill="#6e7681">02</text>
          <text x="45" y="48"><tspan fill="#569cd6">type</tspan> <tspan fill="#4ec9b0">ButtonVariant</tspan> = <tspan fill="#ce9178">'primary'</tspan> | <tspan fill="#ce9178">'secondary'</tspan> | <tspan fill="#ce9178">'ghost'</tspan>;</text>
          
          <text x="15" y="71" fill="#6e7681">03</text>
