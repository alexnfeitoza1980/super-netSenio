          <text x="15" y="140" fill="#6e7681">06</text>
          <text x="45" y="140">})</text>
          
          <text x="15" y="163" fill="#6e7681">07</text>
          <text x="45" y="163"><tspan fill="#569cd6">export class</tspan> <tspan fill="#4ec9b0">AmgButtonComponent</tspan> {</text>
          
          <text x="15" y="186" fill="#6e7681">08</text>
          <text x="65" y="186"><tspan fill="#6a9955">/** Variante visual do botão com default amigável */</tspan></text>
          
          <text x="15" y="209" fill="#6e7681">09</text>
