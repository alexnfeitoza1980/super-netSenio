<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Browser — Estado de Erro Humanizado com Fallback Gracioso</text>
    
      
      <g transform="translate(60, 80)">
        <rect width="800" height="390" rx="8" fill="#1e293b" stroke="#334155"/>
        
        <!-- Tela de Erro Humanizada no Centro -->
        <g transform="translate(160, 40)">
          <rect width="480" height="240" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
          
          <circle cx="240" cy="50" r="24" fill="rgba(245, 158, 11, 0.15)"/>
          <text x="240" y="58" font-family="system-ui, sans-serif" font-size="22" fill="#f59e0b" text-anchor="middle">☕</text>
          
          <text x="240" y="105" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Tivemos um Imprevisto Momentâneo</text>
          <text x="240" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Não se preocupe: seus dados rascunhados foram salvos no dispositivo.</text>
          
          <!-- Botão de Ação Primária -->
          <rect x="170" y="160" width="140" height="36" rx="6" fill="#2563eb"/>
          <text x="240" y="183" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Tentar Novamente</text>
          
          <text x="240" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Código da Ocorrência: AMG-404 · Notificamos nossa equipe técnica automaticamente.</text>
        </g>
        
        <!-- Callout Dale Carnegie -->
        <g transform="translate(60, 300)">
          <rect width="680" height="70" rx="6" fill="#020617" stroke="#334155"/>
          <text x="20" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">DALE CARNEGIE · CAPÍTULO 12: "SE ERRAR, RECONHEÇA O ERRO COM RAPIDEZ E EMPATIA"</text>
          <text x="20" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Um erro 500 do servidor não deve cuspir um alerta vermelho assustador no rosto do usuário. Um bom ErrorHandler captura a exceção, protege os dados locais e oferece uma saída honrosa e acolhedora.</text>
        </g>
      </g>
    </g>
    
</svg>