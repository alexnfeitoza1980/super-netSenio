<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  
  <!-- Grid Sutil de Engenharia -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="450" x2="960" y2="450"/>
    <line x1="160" y1="0" x2="160" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="800" y1="0" x2="800" y2="540"/>
  </g>

  
    <g filter="url(#winShadow)">
      <rect x="40" y="30" width="880" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
    <!-- Barra de janela macOS / Chrome -->
    <path d="M 40,40 a 10,10 0 0 1 10,-10 h 860 a 10,10 0 0 1 10,10 v 26 h -880 z" fill="#1e293b"/>
    <circle cx="58" cy="48" r="6" fill="#ff5f56"/>
    <circle cx="78" cy="48" r="6" fill="#ffbd2e"/>
    <circle cx="98" cy="48" r="6" fill="#27c93f"/>
    <rect x="340" y="38" width="280" height="20" rx="5" fill="rgba(255,255,255,0.08)"/>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">DOM Inspector &amp; Multi-slot Content Projection</text>
    
      
      <g transform="translate(60, 80)">
        <!-- Estrutura do Componente AmgCard -->
        <rect width="400" height="400" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa">COMPONENTE: &lt;amg-card&gt;</text>
        
        <!-- Slot Header -->
        <g transform="translate(20, 50)">
          <rect width="360" height="80" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4 4"/>
          <text x="15" y="25" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">&lt;ng-content select="[amgHeader]"/&gt;</text>
          <text x="15" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Slot opcional para cabeçalhos, títulos e ações rápidas</text>
        </g>
        
        <!-- Slot Body -->
        <g transform="translate(20, 145)">
          <rect width="360" height="130" rx="6" fill="#0f172a" stroke="#4ade80" stroke-dasharray="4 4"/>
          <text x="15" y="25" font-family="Consolas, monospace" font-size="11" fill="#4ade80">&lt;ng-content/&gt; (Corpo Padrão)</text>
          <text x="15" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Recebe qualquer conteúdo livre fornecido pelo consumidor</text>
        </g>
        
        <!-- Slot Footer -->
        <g transform="translate(20, 290)">
          <rect width="360" height="80" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-dasharray="4 4"/>
          <text x="15" y="25" font-family="Consolas, monospace" font-size="11" fill="#f59e0b">&lt;ng-content select="[amgActions]"/&gt;</text>
          <text x="15" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Slot reservado para barras de botões alinhadas</text>
        </g>
        
        <!-- Lado Direito: Aplicação Consumidora -->
        <g transform="translate(430, 0)">
          <rect width="390" height="400" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
          <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">TEMPLATE DO CONSUMIDOR:</text>
          
          <g transform="translate(20, 50)" font-family="Consolas, monospace" font-size="11" fill="#d4d4d4">
            <text x="0" y="15" fill="#38bdf8">&lt;amg-card&gt;</text>
            <text x="15" y="40" fill="#7dd3fc">&lt;div amgHeader class="flex-between"&gt;</text>
            <text x="30" y="65">&lt;h3&gt;Feedback Construtivo&lt;/h3&gt;</text>
            <text x="30" y="90">&lt;span class="badge"&gt;Pendente&lt;/span&gt;</text>
            <text x="15" y="115" fill="#7dd3fc">&lt;/div&gt;</text>
            
            <text x="15" y="150" fill="#86efac">&lt;p&gt;O time entregou o módulo sem atritos.&lt;/p&gt;</text>
            
            <text x="15" y="185" fill="#fcd34d">&lt;div amgActions&gt;</text>
            <text x="30" y="210">&lt;amg-button variant="ghost"&gt;Dispensar&lt;/amg-button&gt;</text>
            <text x="30" y="235">&lt;amg-button&gt;Agradecer&lt;/amg-button&gt;</text>
            <text x="15" y="260" fill="#fcd34d">&lt;/div&gt;</text>
            <text x="0" y="290" fill="#38bdf8">&lt;/amg-card&gt;</text>
          </g>
          
          <rect x="20" y="330" width="350" height="50" rx="4" fill="#1e293b"/>
          <text x="35" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">🤝 Inversão de Controle Dale Carnegie:</text>
          <text x="35" y="368" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Você fornece a estrutura; o consumidor define a alma.</text>
        </g>
      </g>
    </g>
    
</svg>